# Design System — Depredadog
# Convención: ver .devin/skills/design-system-docs
# Cada cambio visual → bump de version + spec actualizado + entrada en changelog.

meta:
  product: Depredadog
  version: 1.40.0
  updated: 2026-11-20

palette:
  # Identidad Depredadog — "condimentos" (definida por el usuario, §001):
  # ketchup / mostaza / pan / parrilla / pepinillo.
  # MVP: solo tema oscuro (decisión del usuario) — ThemeMode.dark fijo en
  # MaterialApp.router, ignora el tema del sistema. Los tokens *_light
  # quedan documentados y en AppColors/AppTheme.light() sin usarse, por si
  # se reactiva el soporte claro más adelante.
  primary_light: "#D62828"
  secondary_light: "#FBBF24"
  tertiary_light: "#5B8C3A"
  surface_light: "#FFF3D6"
  scaffold_light: "#FFFFFF"
  on_surface_light: "#4A2511"
  error_light: "#B3261E"
  primary_dark: "#F4BE38" # mostaza ámbar — decisión del usuario (antes #FDD019)
  secondary_dark: "#F6CE6B"
  tertiary_dark: "#8FBF6A"
  surface_dark: "#241511"
  scaffold_dark: "#000000" # negro puro — decisión del usuario
  on_surface_dark: "#FFF3D6"
  error_dark: "#F2B8B5"
  on_brand_gradient: "#FFFFFF"

typography:
  scale: material3 # display/headline/title/body/label por defecto de M3
  login_headline: "headlineSmall w800, letterSpacing 1.2, color primary"

spacing:
  unit: 4
  tokens: {xs: 4, sm: 8, md: 16, lg: 24, xl: 32}

components:
  app_theme_mode:
    description: "MVP solo oscuro (decisión del usuario): MaterialApp.router con theme=AppTheme.dark(), darkTheme=AppTheme.dark(), themeMode=ThemeMode.dark fijo — ignora el brightness del sistema. AppTheme.light()/AppColors *Light no se eliminaron (quedan sin usar, reversible). Consecuencia en Android nativo: values/styles.xml unificado (LaunchTheme/NormalTheme parten de Theme.Black.NoTitleBar sin calificador -night) para que el splash nativo también sea negro fijo y no haya flash blanco→negro con el sistema en modo claro — se eliminaron values-night/ y drawable-night-v21/ por redundantes."
  app_backdrop:
    status: "ELIMINADO — degradado de plantilla; el splash Flutter pasó a scaffold liso + imagotipo real"
  app_brand_mark:
    status: "ELIMINADO — la flama Material provisional fue reemplazada por el imagotipo real"
  app_launcher_icon:
    description: "Ícono launcher FIJO (decisión del usuario tras probar el modo-dual): isotipo tintas blancas como VectorDrawable (drawable/ic_launcher_foreground.xml, desde isotipo_mascota_.svg) sobre plato #000000, igual en claro y oscuro. El modo-dual se descartó — launchers/Settings cachean el ícono sin el modo ('no cambia nada'). El margen ~18%/lado (arte ~64% del lienzo) vive en el <group> del vector (viewport 3200², scale 3.48573, translate 575/736) — replica el lienzo de isotipo_icono_*. Compartidos: monochrome=silueta vectorial (themed icons), playstore 512 en store_assets/ y ic_launcher.png/round legacy (API<26, raster desde isotipo_icono_blanco). Pendiente: set iOS."
  splash_native_icon:
    description: "Splash nativo SIN ÍCONO (decisión final del usuario) — @drawable/splash_icon_empty, un VectorDrawable 240dp transparente (sin arte visible), solo para suprimir el fallback de Android 12+ que autocompone el ícono del launcher cuando no se declara windowSplashScreenAnimatedIcon. Solo queda el plato liso. Motivo medido en perfil de píxeles: tanto el PNG isotipo_icono_* como el VectorDrawable 1:1 del SVG oficial dieron el mismo blur en el borde — la Splash Screen API rasteriza el ícono a un Icon/bitmap internamente antes de la animación de reveal, independiente del formato/tamaño de la fuente (cambiar android:width/height 288→240dp no movió ni un byte). El primer logo nítido que ve el usuario es el del splash Flutter (Image.asset, Skia puro). MVP solo oscuro: el plato ya no es \"por tema\" — siempre #000000 (ver app_theme_mode)."
  brand_kit:
    description: "Kit completo en Design/brand/: png/ por densidad (0.75x–4x), svg/ fuentes vectoriales, appicon-pack-mascota-color/ (pack previo, registro). Convención de nombres: _blanco = tinta blanca para fondos oscuros, _negro = tinta oscura para fondos claros, _mascota = full color, _mono_* = una tinta, isotipo_icono_* = isotipo con margen de compensación horneado (~64% del lienzo) — referencia de composición para el <group> de los VectorDrawable y fuente de los raster legacy/API<26. Los SVG isotipo_mascota_* son la fuente de los VectorDrawable de ícono/splash. Tagline oficial: 'HOT DOGS & MÁS'."
  brand_tagline:
    description: "Tagline oficial de la guía de marca: 'HOT DOGS & MÁS'."
  elevated_button_primary:
    description: "Ancho completo, alto 52, radius 14, fondo sólido primary + texto onPrimary w600 16px (override del tonal M3 — la marca pide el primario sólido). En dark: mostaza sólida con texto negro rico. Loading: spinner 22px strokeWidth 2.5 color onPrimary DENTRO del botón (reemplaza solo el texto, sin deshabilitar ni atenuar el fondo — decisión del usuario: el botón sigue mostaza y onPressed queda inerte; el cubit ignora re-entradas). Durante su petición, TODOS los demás controles interactivos de la pantalla se bloquean con IgnorePointer(ignoring: isInProgress) — apariencia intacta, nada se atenúa (el usuario rechazó el disabled visible; el disabled solo pinta cuando es el estado semántico propio del control, ej. cooldown de reenvío)."
  custom_text_field:
    description: "Campo de formulario con label externo arriba (labelLarge w600 onSurface — atenuado a onSurfaceVariant cuando enabled:false para que el label no se lea tappable, revisor-ui §030.1), icono prefijo opcional, radius 14, fill surfaceContainerLowest, enabledBorder outlineVariant. Foco en onSurface 1.6px — el primario rojo se confundía con error (feedback usuario). Error en línea reservada con helperText ' ' para no re-fluir el formulario. §030.1: el hintStyle vive en inputDecorationTheme (bodyMedium 14 + onSurfaceVariant explícito — el default M3 16pt competía con label y texto real, feedback del usuario; el color se fija porque bodyMedium traería el suyo y pintaría el hint como texto escrito)."
  google_sign_in_button:
    description: "OutlinedButton ancho completo alto 52 radius 14, logo G oficial (assets/images/google_g.png) + texto 'Continuar con Google' (clave compartida loginGoogleButton — recomendación oficial de Google para superficies sign-up+sign-in; antes 'Ingresar'). Usado en login + register paso 1 (§013) — al ser widget compartido, ocultarlo en prod cubre ambas superficies. INTEGRADO (§014): onPressed lanza el flujo nativo del SDK → idToken → POST /auth/google → sesión → /home; cancel del selector = silencio; errores → toasts mapeados (suspendido/sin conexión/demasiados intentos) o genérico 'No pudimos entrar con Google'. Sin client ID el SDK falla → genérico (decisión del usuario: sin gate). Fallback: onPressed null → toast 'Disponible próximamente'. Config de prod pendiente — ver pendientes/006."
  app_toast:
    description: "Feedback efímero ÚNICO canal: AppToast (lib/core/widgets/app_toast.dart) sobre fluttertoast — error (bg error / texto onError), success (bg primary / texto onPrimary) o info (bg surfaceContainerHighest / texto onSurface — §016, neutra tipo 'Disponible próximamente'), gravity BOTTOM, LENGTH_LONG. Reemplaza el estándar SnackBar anterior por decisión del usuario — NUNCA ScaffoldMessenger.showSnackBar directo. Se dispara siempre desde BlocListener (un listener por efecto con su propio listenWhen — un solo listener con else-if encadenado produjo un toast falso de 'reenviado' en transiciones ajenas: bug detectado por revisor-ui). El plugin nativo no dibuja ícono: AppToast.info acepta icon: opcional para una futura migración a toast custom."
  app_shell:
    description: "Marco persistente del área autenticada (§016): StatefulShellRoute.indexedStack con 3 branches (/home, /orders, /profile — constantes en AuthGuard, hijas NUNCA rutas raíz). Estructura AppShellLayout = Column[ShellHeader + Divider 1px outlineVariant + Expanded(shell)] + NavigationBar M3. Header 64dp: margen 16px, imagotipo_horizontal_blanco.png 40px (variante HORIZONTAL del brand kit — el vertical dejaba el tagline ilegible en banda; decisión del usuario), Spacer, store_status_chip (real desde §029 — BlocBuilder sobre StoreStatusCubit del shell; unknown → chip oculto, nunca miente, ver componente) + IconButton campana notifications_outlined + IconButton carrito shopping_cart_outlined con Badge REAL (§020 — unidades Σ quantity del CartCubit via context.select, isLabelVisible count>0, cap visual '99+'; backgroundColor primary / textColor onPrimary — el default M3 pintaba rosa-error ajeno a la marca, hallazgo revisor-ui) que navega con PUSH a AuthGuard.cartRoute (preserva el stack: volver del carrito regresa al detalle con la personalización intacta — go() la destruía, revisor-ui §020) y se DESHABILITA estando ya en el carrito (GoRouterState.uri == cartRoute → onPressed null + Semantics enabled:false — un push sobre sí misma apilaba la pantalla y el back mentía, re-crítica §020). A11y resuelto: Semantics combinado 'Carrito, N ítems' (cartBadgeA11y) envuelve el botón + ExcludeSemantics en el label del badge. La campana sigue PROVISIONAL → AppToast.info 'Disponible próximamente' hasta que exista el módulo notificaciones. NavigationBar default M3 (~80dp + insets — sin height explícito): destinations Inicio home_outlined→home_rounded, Pedidos receipt_long_outlined→receipt_long_rounded, Perfil person_outline_rounded→person_rounded + Cocina soup_kitchen_outlined→soup_kitchen_rounded como CUARTO destino SOLO con rol admin (§034 — 'órdenes manuales a un clic', decisión del dueño; las branches del shell siguen estáticas — lo condicional es el destino dibujado y el guard de /admin). La barra se envuelve en ListenableBuilder(listenable: locator<AuthSession>()): login/logout de un admin dibuja/quita el destino EN VIVO sin rebuild del router; !isAdmin && currentIndex>2 → postFrameCallback goBranch(0) (logout estando en Cocina devuelve a Inicio sin mutar navegación en build) + selectedIndex clampeado a 0 en el frame de transición (un índice 3 con 3 destinos crashea antes del callback). Indicador pill secondaryContainer; goBranch entre secciones (NUNCA push — no mueve currentIndex) y re-tap del tab activo = initialLocation:true (vuelve a la raíz de la sección). Back nativo (decisión del usuario + fix §031b): PopScope(canPop: currentIndex==0 || context.canPop()) — con una hija apilada sobre el branch (El local, detalle de pedido, direcciones…) el back hace POP de la hija primero; en la raíz de un tab ≠ Inicio goBranch(0) a Inicio; en Inicio sale de la app. Sin el canPop() el scope se tragaba el pop de TODAS las hijas de branches no-home y el back nativo mentía (bug reportado por el usuario). Tooltips localizados (shellNotificationsTooltip/shellCartTooltip), imagotipo con semanticLabel appName."
  module_placeholder:
    description: "Destino provisional de cada branch del shell (§016) mientras su módulo real no existe. Patrón pantalla de estado del estándar: Icon 80px primary (el ícono selected de su sección: home_rounded / receipt_long_rounded / person_rounded) + nombre del módulo titleMedium + 'Disponible próximamente' bodyMedium onSurface α0.7, centrado. Params: icon, moduleLabel (localizado). Reemplazó al texto plano 'X — Disponible próximamente' (sin jerarquía y duplicaba el label del tab activo — hallazgo revisor-ui)."
  auth_required_view:
    description: "Muro de auth compartido (§031 — auth por demanda; lib/core/widgets/auth_required_view.dart): lo que ve el invitado donde hace falta cuenta. Familia de las pantallas de estado: ícono de sección DENTRO de tile primaryContainer redondeado (param tileSize — canon 96px en pantalla de estado, 80 en card acotada; geometría de las filas del perfil: glifo = tile·0.5 en onPrimaryContainer, radio = tile·0.25 — decisión del usuario §031b tras el DIRECCION del revisor-estetico: el Material Icon pelado era la superficie más plantilla; se eligió el híbrido sobre mascota porque conserva la pista de sección y emparenta con los tiles de las filas) + título titleMedium Anton + body bodyMedium onSurface α0.7 centrado + SizedBox 48/min-width 180 FilledButton 'Iniciar sesión' (la única acción del muro no puede ser la píldora más tímida — revisor-estetico) + SizedBox(4) explícito + TextButton Text.rich '¿No tienes cuenta? Regístrate' (pregunta a tinta plena onSurface como el footer del login + link primary w700 — mejor hit area y label semántico que el par text+gesture). Íconos = variante unselected del nav de su tab (receipt_long_outlined / person_outline_rounded — revisor-ui: espejan el destino que bloquean). Ambos CTAs hacen context.push a login/register con ?from= encodeado (Uri.encodeComponent) — el éxito devuelve al punto exacto (sanitizeFrom del guard rechaza no-'/' y '//…'). Layout-neutral (Column min): la cuna la decide el host — centrado como estado del tab en Pedidos (padding left=franja + right=blackZoneMargin — el texto ya no llega al borde físico, revisor-ui), dentro de una straddle_card en Perfil invitado (porque debajo fluye contenido real: 'El negocio')."
  verify_email_code_input:
    description: "OTP de 6 casillas 48×56, radius 14 (=radius del sistema), fill surfaceContainerLowest, borde 1px outline inactivo / 1.6px primary activa / 1.6px error en error, dígito titleLarge w600 onSurface. Implementación propia (pinput se descartó: v7 exige ancestro Material del paquete material_ui desacoplado, incompatible con el Scaffold clásico): un TextField INVISIBLE cubre la fila (Positioned.fill, texto transparente, showCursor off) y captura teclado/digitsOnly/max 6/autofillHints oneTimeCode — sus casillas son puro render AnimatedContainer. OJO técnico: el inputDecorationTheme global trae filled+bordes por estado — hay que anularlos explícito (filled:false + los 6 borders por estado en InputBorder.none) o pinta una barra encima de las casillas. Auto-submit al completar el 6to dígito; bloqueo por IgnorePointer en isInProgress (sin atenuar); borde 'activo' sigue al FocusNode vía ListenableBuilder; pegar habilitado (menú contextual — el formatter limita a 6). A11y: Semantics 'código de verificación, X de 6' en el grupo + casillas en ExcludeSemantics. Desde §011 el render vive en el widget genérico SixDigitCodeField (params: controller/focusNode/hasError/onChanged/onSubmitted/semanticsLabel/autofocus) — VerifyEmailFormFields solo lo rebinda a su cubit y /forgot-password lo usa con autofocus:false (el wizard nunca abre el teclado al cambiar de paso)."
  remember_row:
    description: "Fila bajo el campo contraseña: Checkbox 'Recuérdame' (compacto, tap en texto alterna) a la izquierda + link '¿Olvidaste tu contraseña?' (bodySmall primary w600) a la derecha. rememberMe decidirá en integración si el refresh token persiste entre sesiones."
  login_brand_header:
    description: "Imagotipo vertical 148px (Hero tag HeroTags.brandImagotipo, vuela desde el splash) + headline primary + subtítulo (bodyMedium onSurface 70%). Asset por tema: imagotipo_depredadog.png (=imagotipo_negro_*) en claro; imagotipo_depredadog_dark.png (=imagotipo__1*, trazos blancos + color) en oscuro — con MVP solo oscuro (app_theme_mode) siempre resuelve a la variante dark. Densidades 1.5x–4x."
  register_stepper:
    description: "Indicador de pasos de wizard (register §009, generalizado en §011): N círculos 32px + conectores 2px + labels ('Datos'/'Cuenta'/'Revisión' en register; 'Correo'/'Código'/'Clave' en forgot-password). Estados: actual=círculo lleno primary + número onPrimary + label w600; completado=círculo tenue con ✓ + conector lleno; pendiente=outline + conector tenue. SOLO visual — no navega al tocar (la navegación es flecha/Atrás/back). Implementación: desde §011 el render es el widget genérico WizardStepper (params: labels/currentStep/progressLabel) — N segmentos Expanded simétricos, cada uno = media línea + círculo + media línea, así los conectores tocan el borde del círculo sin aire (el OverflowBox inicial se descartó — reventaba con altura infinita en tests y emulador). RegisterStepper quedó como wrapper fino que lee RegisterCubit; /forgot-password lo usa con su propio BlocBuilder. Fijo fuera del SingleChildScrollView con 16px al título. A11y: liveRegion anuncia 'Paso X de N'; cada segmento expone label+estado (completado/actual/pendiente) y selected en el actual (claves registerStep* reutilizadas — mismo texto)."
  signature_strip:
    description: "La firma visual del catálogo (§017, decisión iterada del usuario): franja vertical mostaza de ANCHO FIJO 40% de pantalla (kSignatureStripFraction = 0.4), alto completo, anclada a la izquierda — corre detrás de TODO el contenido scrolleable (Stack: [SignatureStrip, ListView]), no un elemento por sección. Constantes compartidas en signature_strip.dart: kCardStripInset = 0.5 (dónde arranca la card dentro de la franja — a 0.6 el conjunto quedaba con demasiado aire lateral, feedback del usuario), kFrameOverhang = 44 (cuánto sobresale la imagen del borde izquierdo de la card), kFrameTextGap = 14 (gap imagen→texto), blackZoneMargin(width) = width·0.4·0.5 − 44 (margen derecho SIMÉTRICO al sobrante izquierdo del marco — el conjunto card+imagen queda centrado en pantalla; antes la card llegaba al ras derecho y se sentía corrida). En pantallas SIN franja (ninguna hoy) no aplica."
  straddle_card:
    description: "La familia de cards del catálogo (§017): TODA card de home/lista/promo/vacío cruza el límite mostaza↔negro — nace dentro de la franja (left = strip·kCardStripInset) y termina con margen derecho blackZoneMargin (simétrico). Geometría: alto 116 (productos/categorías/promo; hero 144), radius estándar Card, color surfaceContainerLow (EXCEPCIÓN promo: surfaceContainerHigh — tono de la hero, decisión del usuario como 2ª diferenciación). Composición dentro de la card: imagen FLOTANTE a la izquierda a caballo del borde (ver product_image — el tile se posiciona cardLeft − size/2 + kFrameOverhang... en la práctica sale del borde ~50%: la mitad sobre mostaza, la mitad sobre la card) → texto anclado a kFrameTextGap del borde derecho de la imagen (antes existió un 'eje universal' = borde franja + 16dp — el usuario lo quitó: dejaba ~40dp de aire entre imagen y texto; ahora el texto 'abraza' la imagen caiga donde caiga sobre la superficie oscura de la card) → acceso derecho: chevron chevron_right 18dp primary con 16dp de padding (antes 16dp pegado al borde, feedback del usuario) en categorías/promo; botón circular '+' primary en productos; FilledButton '+ Agregar' compacto + precio primary en la hero. InkWell cubre la card entera (hit ≥48dp). Card fantasma (vacíos): misma cuna a caballo, sin contenido ni affordance, centrada en el viewport — el gesto de la firma persiste aunque la categoría no tenga productos."
  product_image:
    description: "Widget compartido de imagen de producto/categoría (§017): tile SIN marco ni fondo (el usuario probó recuadro blanco → crema → degradado → mostaza + borde y lo descartó: 'quitar el recuadro, las imágenes al tamaño actual') — la imagen flota sobre la franja/card. Tamaño = (cardHeight − 16) · 0.8 cuadrado; param aspectRatio (default 1) preparado para producción: los assets reales serán 16:9 y se pasará 16/9 (el tile se vuelve apaisado conservando la altura — revisar el gap texto al ensancharse). BoxFit.contain sobre PNG re-trimados al sujeto +5% (los canvas originales 1000×1000 con ~13% de margen vacío encogían al sujeto ~40% — re-trimados en assets/images/products/). IgnorePointer para que el tap pase a la card. INTEGRADO (§019): param opcional imageUrl — cuando el backend sirva fotos (product_images, hoy null) Image.network manda y el asset local por slug queda de fallback (errorBuilder); los callers resuelven el asset vía CatalogAssets.productAsset(slug)."
  sold_out_tag:
    description: "Tag de disponibilidad agotada (§019): píldora compacta errorContainer/onErrorContainer radius 8, texto 'Agotado' (catalogSoldOut) labelSmall w800 — reemplaza el affordance de la card en el mismo slot (en product_card ocupa el hit-area 48dp del círculo '+'; en hero_product_card el slot del FilledButton '+ Agregar'; en el detalle el CTA del footer es FilledButton con onPressed:null mostrando el mismo texto y en las OptionRow de adicionales el trailing '+$X' se sustituye por el texto). Regla §019 ajustada por el usuario: producto agotado efectivo (isSellable=false — isAvailable=false del dueño O un ingrediente INCLUIDO isEssential agotado, ej. salchicha/pan: sin ellos no hay perro) → tag + sin tap SIN atenuación (la Opacity 0.55 de card+imagen se descartó — 'con el botón Agotado basta'); opción isAvailable=false → fila/chip con enabled:false → tap inerte + Opacity 0.45 (aprobada) + ícono Icons.cancel_rounded error reemplazando el check/X (en SelectChip la X va antes del nombre, 14dp). REGLA DE CAMBIO GRATIS (decisión del usuario): ingrediente INCLUIDO agotado (RemovableRow enabled:false) muestra junto a la X un icono swap_horiz_rounded 20dp primary (IconButton 28dp, FUERA de la atenuación; semanticLabel=detailSwapCta) SOLO si la opción es isReplaceable — agotado NO reemplazable (salchicha/pan, corazón del producto) muestra la X sin ↔ — que se vuelve expand_less_rounded al desplegar — expande (AnimatedSize 180ms easeOutCubic, top-anchored, hardEdge) bajo la fila los adicionales disponibles E isReplacementEligible (lo que el dueño permite regalar — la salchicha doble nunca sale) como OptionRows indentados SIN etiqueta trailing (el usuario descartó la palabra 'Gratis' en toda la app — detailFreeTag eliminada); elegir UNO colapsa el picker de una y el reemplazo queda como FILA PROPIA bajo el agotado con colores de fila activa — sangrada 20dp + gancho subdirectory_arrow_right_rounded 16dp primary (↳, decisión del usuario: así se lee como hija del ingrediente agotado cuando hay varios), tocarla o el icono reabre el picker para cambiarla. Solo el ingrediente agotado habilita el cambio — 1:1 por ingrediente agotado. UNICIDAD DEL CANDIDATO (bug reportado por el usuario): un adicional ya tomado como reemplazo por OTRO agotado NO se lista en su picker — la exclusión es entre agotados, el propio sí se sigue listando; si para una agotada no queda ningún candidato libre el ↔ se oculta (nunca picker vacío)."
  catalog_states:
    description: "Estados compartidos de carga/error de las pantallas de catálogo (§019): CatalogLoadingView = CircularProgressIndicator primary centrado (primera carga sin datos). CatalogErrorView = patrón pantalla de estado: ícono wifi_off_rounded 40px onSurface α0.5 + título 'No pudimos cargar la carta' titleSmall w700 + subtítulo 'Revisa tu conexión e inténtalo de nuevo.' bodySmall α0.65 + FilledButton.tonalIcon 'Reintentar' (icono refresh 18px) — SOLO aparece cuando la primera carga falla sin caché que mostrar; el refresh silencioso con datos NUNCA cae acá (falla en silencio conservando el menú). El detalle suma una vista inline hermana para slug desconocido: restaurant_outlined + 'Este producto ya no está en la carta' + 'Volver al menú'."
  promo_banner:
    description: "Carrusel de promociones activas (§017): slot fijo arriba del listado con PageView.builder INFINITO (initialPage = len·500 ≈ 2500 — loop seamless en ambas direcciones, también manual hacia atrás) + Timer de auto-avance cada 4s que se reinicia tras cualquier cambio de página (si el usuario desliza, espera otros 4s). Dots indicadores centrados bajo la card (activo=primary, solo si hay >1 promo). El slide es una straddle_card de surfaceContainerHigh (tono elevado de la hero — decisión del usuario) + CINTA diagonal mostaza 'PROMO' en la esquina superior derecha (variante escogida de una galería de 4: invertida / bandera / badge / invertida+badge — el usuario eligió la bandera) + título titleSmall + countdown 'Termina en {Xh Ym|Xd Yh}' bodySmall atenuado con icono schedule (decisión: contador real, no 'solo hoy') + chevron 18dp. Tipos de oferta cubiertos por el mock (5): 2×1/BOGO, item gratis con compra, % OFF en la carta, envío gratis, combo a precio fijo. Integración: endsIn se computará del endsAt real del módulo promotions con refresh por minuto."
  store_status_chip:
    description: "Píldora compacta del estado del negocio (§017, real desde §029): dot 8dp (verde abierto / rojo cerrado) + label 'Abierto'/'Cerrado' bodySmall w600 — vive en el ShellHeader entre el imagotipo y la campana (decisión del usuario: estaba como franja propia en home; se movió al header para ser visible en las 3 tabs) y el aire que ocupaba (~36dp) quedó como primer item del ListView para que el carrusel respire bajo el header. §029: mata el mock isOpen:true — StoreStatusCubit (lazySingleton en el shell, BlocProvider.value + ..refresh() al montar) consulta GET /store/config → isOpen; estado open/closed/unknown, unknown (aún no cargó o el fetch falló sin estado previo) → el header NO renderiza el chip (SizedBox.shrink — nunca miente); refresh() fallido conserva el último estado conocido (un parpadeo de red no apaga el chip). El carrito también lo refresca al entrar (puerta del pago). Sin ETA ('Entrega en 30-45 min' quedó fuera del header por espacio; si vuelve será en contexto checkout/tracking)."
  scrolling_title:
    description: "Patrón de encabezado de pantallas hijas del catálogo (§017/§018 — decisión del usuario): el título Anton mostaza 'naciente' va DENTRO del ListView como primer ítem (sale de pantalla al bajar, reaparece al subir) — NO es un header fijo. La caja del texto entra apenas al mostaza (Align centerRight + FractionallySizedBox widthFactor 0.602 right + Text alineado a la izquierda: el filo de la 1ª letra se funde con la franja → 'nace' del mostaza; punto calibrado a mano por el usuario). La flecha back NEGRA (onPrimary) es lo único FIJO: Positioned top:12/left:4 del Stack, sobre la franja — navegación persistente mientras todo lo demás fluye. Aplica hoy en category_products y product_detail."
  customization_section:
    description: "Card de sección de personalización del detalle (§018): straddle_card estándar con título de sección Anton mostaza (titleSmall) + tag opcional a la derecha (píldora secondaryContainer — sin uso actual tras eliminar 'Gratis') + hairline divisor + contenido. Variantes de fila: RemovableRow (ingrediente propio — check circular primary tacha el nombre con strikeThrough al quitarlo), ExtraStepperRow (§045 — adicional cobrado: nombre bodyMedium maxLines 2 + trailing '+$X.XXX' primary (total extra×N cuando hay selección, unitario si no; 'Gratis' orderSummaryFree cuando extraPrice=0) + stepper −N+ QuantityStepper reusado del carrito a la derecha; padding 14/6, Opacity 0.45 + IgnorePointer cuando enabled:false — agotada O quitada del perro; el radio vacío→check del OptionRow se retiró de adicionales — el contador lo reemplazó), OptionRow (radio pelado → check — queda solo para el picker de reemplazo gratis), SelectChip (topping/salsa gratis — píldora outline→rellena primary con texto onPrimary al activarse, en ChipWrap fluido). El grupo entero scrollea con la pantalla."
  kitchen_item_card:
    description: "Card-imagen de comanda para WhatsApp (§043, aprobada por el dueño — el texto wa.me V1 fue descartado: 'no me gustó el texto formateado'). Render offscreen: KitchenItemCard dentro de RepaintBoundary → toImage → PNG temporal (pedido_<tag>_item_<n>.png) → Share.shareXFiles con UNA card por ítem del pedido. Composición: fondo surface del tema, ancho fijo 600 logical px, padding 28, radius 24 con border outlineVariant — idioma card del sistema. Header: 'DEPREDADOG · PEDIDO #<n>' + '<i>/<n>' muted + hairline. Ítem: '1× El Coyote' Anton primary grande + secciones por línea — 'Se le quitó' (removed, con 'X → reemplazo' en cambio gratis), 'Ingredientes' (receta efectiva — cocina no memoriza la carta), 'Adicionales' (extras con 'Nombre ×N' cuando times>1 — §045), 'Toppings', 'Salsas'. Footer: línea de servicio (Mesa N/Para llevar/Domicilio + dirección y teléfono) + método de pago + 'Nota:' si hay + 'Total: $X.XXX'. SIN foto del producto ni precios por modificador (decisión explícita); marca de agua Depredadog tenue. Disparadores: 'Enviar a cocina' tras crear la comanda y el ícono share_rounded del detalle de pedido — ambos con busy-state (el render+share tarda ~1s)."
  cart_edit_scope_sheet:
    description: "Bottom sheet '¿A cuántos aplicar los cambios?' (§021 — decisión del usuario: pregunta AL GUARDAR la edición de una fila con quantity>1; copy con referente, revisor-ui): showModalBottomSheet<bool> surfaceContainerLow con radius superior 16, título titleSmall w700 PRIMARY (mostaza — la única pregunta que no cantaba, pulido estético) + 2 ListTiles — 'Solo 1' (looks_one_rounded → pop false: separa una unidad con la nueva config, la original queda qty−1 y la editada se inserta ADYACENTE a su origen) y 'Las {count}' (format_list_numbered_rounded → pop true: cambia la fila entera); null = cancelado (no se guarda nada). Solo lo invoca el modo edición del detalle."
  store_closed_message:
    description: "Mensaje que OCUPA EL LUGAR del CTA cuando el local está cerrado (§029 — decisión del usuario: no banner ni botón deshabilitado). StoreClosedMessage (lib/core/widgets): SizedBox altura FIJA 48 = slot exacto del FilledButton (el footer no salta en el swap, hallazgo revisor-ui) con Row centrada [Icons.info_outline_rounded 16px error + texto bodyMedium w500 error maxLines 2 ellipsis] — misma familia de los avisos inline. Semantics(liveRegion+container): el swap botón→mensaje se anuncia al lector de pantalla. Condición de aparición: SOLO cerrado confirmado — carrito: context.watch<StoreStatusCubit>() == closed; checkout: !state.store.isOpen (fetch propio) OR state.storeClosedByRejection (409 STORE_CLOSED del POST /orders — cerrado confirmado por el backend aunque el fetch haya llegado abierto). unknown nunca lo muestra; storeFailed conserva su banner con Reintentar (falla de fetch ≠ cerrado)."
  segmented_toggle:
    description: "Toggle segmentado de 2 opciones del checkout (§022): track Container 48dp surfaceContainerHighest radius 24 con padding 4 (píldoras de 40dp de hit area — mínimo interactivo, revisor-ui), dentro Row de 2 píldoras Expanded simétricas — la activa es AnimatedContainer 150ms radius 20 con fill primary + texto onPrimary w700; la inactiva transparente con texto onSurface α0.7 w500. InkWell StadiumBorder por píldora + Semantics(selected, inMutuallyExclusiveGroup) para TalkBack. Misma decisión visual que el SelectChip lleno (activo = mostaza sólida), aplicada a selección excluyente grande. Usado hoy solo para Recoger/Domicilio."
  profile_menu_row:
    description: "Fila de menú del Perfil (§030): straddle_card surfaceContainerLow radius 16 con tile de ícono cuadrado 44dp radius 12 (fondo primaryContainer α / ícono primary 22px, variantes outlined uniformes — badge_outlined / location_on_outlined / lock_outline / storefront_outlined / support_agent_outlined / logout_outlined; la mezcla rounded+outlined se unificó, revisor-ui) + título titleSmall w700 + subtítulo opcional bodySmall α0.65 (ej. '3 guardadas') + chevron_right 18px primary — chevron SOLO si navega (opensDialog:true lo omite, la flecha promete pantalla y Soporte abre diálogo, revisor-ui). Variante destructive:true — tile errorContainer + ícono/label error, sin chevron (Cerrar sesión). Semantics: ExcludeSemantics en título/subtítulo internos para que TalkBack lea el content-desc del botón una sola vez (mismo fix del badge del carrito §020)."
  profile_section_label:
    description: "Etiqueta de sección del Perfil ('Mi cuenta'/'El negocio', §030.1): texto titleSmall w700 onPrimary (tinta oscura estampada SOBRE la franja mostaza — el primer intento onSurfaceVariant se lavaba gris sobre mostaza y parecía error de capa, revisor-estetico). Acotada al ancho de la zona de franja (FractionallySizedBox al strip) con ellipsis — un label largo antes desbordaba al negro y se renderizaba negro-sobre-negro invisible (revisor-ui). Semantics(header:true) para TalkBack."
  profile_loyalty_card:
    description: "Tarjeta de fidelidad del Perfil (§030.1): straddle_card surfaceContainerLow con headline de puntos titleLarge w800 primary ('120 puntos') + copy de voz 'Tu manada te premia' bodySmall atenuado + mini-label w600 'Tu código para la manada' + código titleMedium w800 letterSpacing 2 con IconButton copy_rounded 20px primary (Clipboard nativo + AppToast 'Código copiado') + línea de referidos 'N personas ya se sumaron con tu código' (plural ICU: nadie/1/N). Ícono info_outline 20px primary en la esquina sup. derecha (tooltip 'Cómo funcionan los puntos', decisión del usuario) → diálogo '¿Cómo funciona la manada?' con reglas GENÉRICAS (puntos por pedido + código referido — las concretas se definen con el módulo loyalty del backend). Robusta: se renderiza aunque code sea null/vacío (la fila del código simplemente no aparece, revisor-ui). Datos mock en fase 1."
  profile_identity_card:
    description: "Tarjeta de identidad del Perfil (§030): straddle_card con avatar circular 56dp primaryContainer + iniciales titleLarge onPrimaryContainer + nombre completo titleSmall w700 + correo bodySmall α0.7 + celular con máscara '3XX XXX XXXX' (_formatPhone — helper compartido en features/orders/utils/format_phone.dart, mismo del detalle de pedido; el número crudo se movió a helper tras pulido estético). Datos mock del ProfileCubit en fase 1 (GET /auth/me llega en integración §031)."
  scrolling_title_tab:
    description: "Variante del patrón scrolling_title para tabs del shell sin flecha (§023 orders / §030 profile): mismo nacimiento de la franja (Align centerRight + FractionallySizedBox widthFactor 0.602 + Text alineado izquierda, headlineSmall w800 primary Anton) como PRIMER hijo del ListView — sale al bajar y reaparece al subir. Se diferencia del scrolling_title de pantallas hijas en que NO hay flecha back fija (el tab no se sale a sí mismo). §034b: los títulos de tab van en VERSALITAS (PEDIDOS / PERFIL / COCINA — decisión del usuario: la 'i' minúscula de Anton no lleva punto y 'Cocina' se leía 'Coclna'; el caps además suena más cartel, coherente con la voz 'VUELVE A LA MANADA')."

screens:
  splash:
    route: "/"
    spec: "Scaffold liso (color por tema; MVP solo oscuro, ver app_theme_mode) + imagotipo centrado 220px en Hero(tag: HeroTags.brandImagotipo) — asset por tema: imagotipo_depredadog.png claro / _dark.png oscuro (mismos del login header). Navega a /login ~800ms DESPUÉS de que el imagotipo decodifica (precacheImage secuencial — el login hereda el ImageCache y el header pinta sin parpadeo; Future.wait se descartó porque pintaba y navegaba en el mismo frame). El Hero hace que el imagotipo vuele del centro (220px) al header del login (148px) en vez de que una pantalla reemplace a la otra en seco. Futuro: aquí vivirá el chequeo de sesión."
  login:
    route: "/login"
    spec: "Scaffold liso + scroll. §031: flecha back FLOTANTE (Positioned 4/4 arrow_back, patrón del detalle — el login ahora llega por push desde los muros o por redirect del guard; el invitado arrepentido ve cómo salir — revisor-ui). canPop → pop al origen; raíz (redirect) → go /home. Bloqueada durante submit (IgnorePointer, igual que register). LoginBrandHeader (imagotipo en el mismo Hero que el splash), campos email/password (CustomTextField con AutofillGroup, error por campo que se limpia al editar), remember_row, ElevatedButton 'Iniciar sesión' (loading: spinner DENTRO del botón, ver elevated_button_primary), divider 'o continúa con', GoogleSignInButton, fila '¿No tienes cuenta? Regístrate'. Submit vacío → errores + toast + foco al primer inválido. Durante la petición todo lo interactivo se bloquea por IgnorePointer sin atenuar (campos, ojo, checkbox, Google, links). Submit real contra /auth/login: éxito → /home, 403 correo-no-verificado → /verify-email. §031 retorno: éxito → context.go(?from sanitizado ?? /home) — el ?from= también se propaga a register/verify/forgot vía _withFrom. Links: 'Regístrate' push a /register; '¿Olvidaste tu contraseña?' (remember_row) push a /forgot-password desde §011 (reemplazó el toast 'Disponible próximamente') — ambas salidas cierran autofill shouldSave:false para que el modal '¿Guardar contraseña?' no compita. Google INTEGRADO (§014): éxito → /home con finishAutofillContext(shouldSave:!isGoogleAuth — no guarda credenciales tipeadas nunca enviadas); errores → toast específico (suspendido/conexión/intentos) o genérico Google."
  verify_email:
    route: "/verify-email"
    spec: "Se llega desde login cuando el backend responde 'correo no verificado' (o con email en extra). Scaffold liso + PopScope(canPop:false → _backToLogin): la flecha top-left FIJA (fuera del bloque centrado — antes flotaba dentro de la Column centrada, bug detectado) y el back nativo de Android ambos van a /login porque se llega con go() y no hay stack que pop. Contenido centrado+scroll: ícono de marca icono_verificar_correo.svg (80px, flutter_svg, elemento firma — ExcludeSemantics, el headline ya describe), headline primary + subtítulo con el email destino, casillas OTP (componente verify_email_code_input), CTA 'Verificar' (loading: spinner DENTRO del botón, ver elevated_button_primary; campo y reenviar se bloquean por IgnorePointer en isInProgress), fila '¿No recibiste el código? Reenviar' con cooldown real 60s ('Reenviar en Ns', TextButton deshabilitado — el disabled visible del cooldown sí pinta: es su estado semántico, no un bloqueo de loading). Feedback por AppToast: error genérico 'Ingresa el código de 6 dígitos' (cubre vacío/parcial), 'Código reenviado', 'Verificación simulada'. resend() limpia código+error (el código viejo queda invalidado) y el TextField oculto se resincroniza por listener. INTEGRADO (§006): submit contra /auth/verify-email (éxito → sesión persistida → /home; código errado → casillas rojas + toast) y reenvío contra /auth/resend-verification."
  register:
    route: "/register"
    spec: "Wizard de 3 pasos (§008 + §009 — aprobado por el usuario: el formulario único de 8 inputs era denso). Header compacto SIN imagotipo (decisión del usuario): flecha top-left + register_stepper fijo + headline primary por paso ('Cuéntanos quién eres' / 'Tu correo y tu contraseña' / 'Todo listo, {firstName}') + subtítulo. Paso 1 'Datos': 4 campos LatAm (primer nombre*, segundo nombre, primer apellido*, segundo apellido) + teléfono opcional; sanitización compartida — solo letras latinas con tilde/ñ/ü + espacio + apóstrofe (' y ’), SIN guion (decisión del usuario), filtro al teclear + validación. Teléfono: solo dígitos máx 10, celular colombiano ^3\\d{9}$ (decisión: solo celular, solo dígitos). Paso 2 'Cuenta': email + contraseña (hint interior 'Ej: HotDog2024' — misma clave del login — + helper 'Mínimo 8 caracteres' bajo el campo) + confirmar (hint 'Repite tu contraseña') con ojos de visibilidad independientes. Paso 3 'Revisión': tarjeta Nombre compuesto/Correo/Teléfono o 'Sin teléfono' — la contraseña nunca se muestra. Navegación (modelo del usuario): flecha top-left SIEMPRE sale a /login (abandonar, no retrocede pasos); TextButton 'Atrás' a la izquierda del primario (solo pasos 2-3) retrocede un paso conservando lo tipeado; back nativo Android retrocede paso (paso 1 sale). Transición AnimatedSwitcher ~250ms + AnimatedSize; scroll reset por paso; contenido top-aligned. Teclado NUNCA abre solo al cambiar de paso (decisión del usuario tras probarlo) — solo al tocar campo o cuando 'Continuar' falla (foco al primer inválido del paso, no navega a otro paso). Validación por paso; submit revalida todo. Errores de campo GENÉRICOS (decisión del usuario): 'Teléfono/Correo/Nombre/Apellido incorrecto' — no revelan la regla. EXCEPCIÓN contraseña corta: el error ES la regla 'Mínimo 8 caracteres' — el helperText se reemplaza por errorText al fallar y 'Contraseña incorrecta' no le decía al usuario qué corregir (decisión del usuario tras verla en pantalla); la misma clave sirve de helper y error. Footer persistente '¿Ya tienes cuenta? Inicia sesión' (hit area ≥44dp + Semantics button). Durante submit: IgnorePointer en todo lo interactivo + guard isInProgress en el cubit. INTEGRADO §010: POST /auth/register real — éxito → /verify-email con email en extra y shouldSave:false; 409 correo-duplicado devuelve al paso 2 con 'Este correo ya tiene cuenta' (emailTaken prima sobre formato). Paso 1 lleva además bloque social Google (§013): tras el primario — divider 'o continúa con' + GoogleSignInButton dentro de AnimatedSize 250ms easeOut topCenter (sin él el footer saltaba ~116px en seco al cambiar de paso) + IgnorePointer(isInProgress); 32px de botón a footer (paridad login, no 24); en pasos 2-3 no existe (SizedBox.shrink — Google reemplaza el registro entero, no lo complementa). La G oficial es el ÚNICO Image de los pasos — la aserción 'sin imagotipo' de los tests apunta específicamente a ella."
  forgot_password:
    route: "/forgot-password"
    spec: "Wizard de 3 pasos (§011 — mismo shell que /register): flecha top-left + WizardStepper fijo con labels 'Correo'/'Código'/'Clave' + headline primary por paso + subtítulo. Paso 1 '¿Olvidaste tu contraseña?': solo correo (primario 'Enviar código'). Paso 2 'Revisa tu correo': subtítulo con el email tipeado (misma frase de verify) + SixDigitCodeField SIN autofocus (el wizard nunca abre teclado al cambiar de paso) + fila '¿No recibiste el código? Reenviar' con cooldown 60s ('Reenviar en Ns', TextButton disabled = estado semántico) — primario 'Verificar'. Paso 3 'Crea tu nueva contraseña': 'Nueva contraseña *' con ojo + hint interior 'Ej: HotDog2024' (clave compartida del login — sin él el campo se veía como caja muerta junto al confirm, detectado por el usuario) + helper 'Mínimo 8 caracteres' + 'Confirmar contraseña *' con hint 'Repite tu contraseña' + ojo independiente — primario 'Cambiar contraseña'. Navegación idéntica a register: flecha SIEMPRE abandona a /login (cualquier paso, pop si quedó apilada); 'Atrás' (pasos 2-3) retrocede paso conservando lo tipeado; back nativo retrocede paso (paso 1 sale). Transición AnimatedSwitcher ~250ms + AnimatedSize; scroll reset; foco al primer inválido del paso al fallar. Errores genéricos reutilizando claves: 'Correo incorrecto' / 'Las contraseñas no coinciden' / toast de código 'Ingresa el código de 6 dígitos' (verifyEmailFormInvalid compartida) — EXCEPCIÓN contraseña corta: el error es la regla misma 'Mínimo 8 caracteres' (el helper se reemplaza por errorText y 'Contraseña incorrecta' no decía qué estaba mal — decisión del usuario). Footer compartido '¿Ya tienes cuenta? Inicia sesión' (RegisterLoginFooter con isInProgress||isResending por parámetro). Loading: spinner DENTRO del primario + IgnorePointer/inerter — cubre también isResending ('Verificar', flecha, footer y codeChanged esperan al reenvío, misma carrera que verify; el listener de resync también escucha isResending para barrer dígitos fantasma del IME). PROVISIONAL: envío de código, check OTP y reset simulados (nextStep valida y avanza; submit delay 800ms → AuthSession.markAuthenticated con User stub 'forgot-preview' → success → /home con shouldSave:true — espejo del auto-login real: sin la sesión stub el guard rebota /home→/login en silencio; la stub solo vive en RAM, muere al reiniciar la app. La integración llega con forgot-password/check-reset-code/reset-password). Auto-avanza al 6to dígito igual que verify; resend() limpia código+error y resincroniza el TextField oculto."
  welcome:
    status: "ELIMINADA (decisión del usuario) — splash va directo a /login para no autenticados"
  shell:
    routes: "/home (Inicio), /orders (Pedidos), /profile (Perfil), /admin (Cocina — §034) — branches de un StatefulShellRoute.indexedStack"
    spec: "Marco autenticado §016 — ver componente app_shell (header 64dp con imagotipo horizontal + campana provisional + carrito real §020 + hairline, NavigationBar de 3 destinos — 4 con rol admin, back→Inicio). Cada branch renderiza module_placeholder hasta que su módulo real aterrice como HIJO de su branch (nunca ruta raíz — eso la sacaría del shell). Guard §031: el default es PÚBLICO con prefijos protegidos; §034 agrega los prefijos admin (/admin y descendientes exigen sesión Y rol admin — invitado → /login?from=, cliente sin rol → /home)."
  home:
    route: "/home"
    spec: "Selector de categorías (§017 + integración §019): Stack[SignatureStrip + ListView]. Contenido: SizedBox 36dp de aire bajo el header → promo_banner carrusel → CategoryCards DINÁMICAS del backend (GET /catalog — una nueva aparece sola sin release; nombre = dato del backend, cover local por slug vía CatalogAssets). Cada card = straddle_card con imagen flotante de categoría + nombre titleSmall Anton + subtítulo ('N productos' / 'Disponible próximamente' en vacías) + chevron 18dp. Tap → push /home/category/:slug. Datos: CatalogCubit lazySingleton compartido en el shell — refresh() silencioso al entrar (sin flicker; si falla conserva caché), primera carga con loading/error + retry (catalog_states)."
  category_products:
    route: "/home/category/:id (hija de la branch /home — conserva shell + nav)"
    spec: "Lista de productos de una categoría (§017 + integración §019): Stack[SignatureStrip + ListView + flecha fija]. Encabezado = patrón scrolling_title con el nombre REAL del backend (resuelto por :categorySlug del CatalogCubit). Lista: hero_product_card del producto isFeatured && isAvailable ('EL DE LA CASA' tag + nombre + tagline + precio + FilledButton '+ Agregar') + product_card por ítem restante (imagen flotante + nombre + tagline 2 líneas max + precio primary + botón '+' circular). Producto agotado → sold_out_tag en el slot del '+' y sin tap — SIN atenuación (§019, decisión del usuario). Tap en card o '+' → push /home/category/:categorySlug/product/:productSlug (detalle). Categorías vacías → card fantasma a caballo centrada en viewport + 'Disponible próximamente' (cover por slug). Datos reales del CatalogCubit compartido + refresh silencioso al entrar; loading/error con retry solo sin caché."
  product_detail:
    route: "/home/category/:categoryId/product/:productId (nieta de /home — conserva shell + nav)"
    spec: "Detalle + personalización del producto (§018 + integración §019): Stack[SignatureStrip + Column[ListView + footer fijo] + flecha fija]. Título del producto = patrón scrolling_title. El producto se resuelve del CatalogCubit por :productSlug (busca en TODAS las categorías). Contenido: _ProductHeaderCard (straddle_card 150dp surfaceContainerHigh, imagen flotante con imageUrl→fallback por slug + ingredientsSummary 'A, B y C.' de los defaults del grupo ingredients + basePrice primary) → customization_section por grupo real del backend: '¿Se le quita algo?' (RemovableRow = opciones del grupo ingredients con includedByDefault && isRemovable — pan/salchicha fijos no aparecen), '¿Le agregamos algo más?' (§045 ExtraStepperRow — !includedByDefault O cualquier incluida con extraPrice>0: TODA la carta de adicionales se ofrece en cada perro, incluido repetible = porción extra cobrada; stepper −N+ sin tope, 0 quita; quitar un incluido limpia su extra y deshabilita la fila — 'sin X + X extra' es inválido; pan/salchicha fuera por precio 0), 'Toppings' y 'Salsas' (SelectChips por slug de grupo; sección solo si hay opciones). Opción agotada → enabled:false (Opacity 0.45 + tap inerte — atenuación de opciones aprobada, la de cards descartada). Ingrediente incluido agotado → icono swap_horiz SOLO si isReplaceable (agotado no reemplazable = solo X) que despliega picker de adicionales isAvailable && isReplacementEligible sin etiqueta trailing (reemplazo 1:1 sin costo — regla del usuario; la palabra 'Gratis' se eliminó de toda la UI por decisión del usuario). Footer fijo opaco: 'Total' + total dinámico (basePrice + Σ extraPrice de adicionales) + FilledButton 'Agregar al carrito' REAL (§020: arma el CartItem con filas CartModifier added/removed — quitados, reemplazo gratis como removed+added a 0, adicionales con precio real, toppings/salsas a 0 — lo envía al CartCubit, AppToast.success 'Agregado al carrito' y context.pop() a la carta) — producto agotado → FilledButton disabled 'Agotado'. Slug desconocido tras refresh → vista inline 'Este producto ya no está en la carta' + 'Volver al menú'. Refresh silencioso al entrar. MODO EDICIÓN (§021 + correcciones revisor-ui): la misma pantalla monta en /home/cart/edit (hija de cart, slideUp — extra=CartItem, redirect a cartRoute si el extra no lo es) con param editingItem — los 5 sets de selección (hoy agrupados en DetailSelections _sel) se precargan una vez mid-build vía DetailSelections.fromCartItem (removed→removed; added con replacesOptionId→replacements[agotado]; added sin marca→extras/toppings/sauces según el grupo del producto; opción caída de la carta se descarta; el id reemplazado NO entra a _removed — igual que en el modo agregar vive solo en _replacements: tenerlo en ambos emitía la fila removed DUPLICADA al guardar, bug crítico) y _buildModifiers además filtra los removed ya cubiertos por replacements (barrera). Cue de orientación: el título naciente pasa a 'Editando · {name}' (detailEditingTitle — era idéntica a la de agregar salvo el CTA), el CTA dice 'Guardar cambios' (cartEditSaveCta) y con qty>1 el label del footer pasa a 'Total por unidad' (detailTotalPerUnitLabel — el total es por unidad y el sheet pregunta a cuántos). El CTA queda HABILITADO aunque el producto esté agotado — el ítem ya vive en el carrito y la revalidación real es del backend al crear la orden. Guardar: si la config no cambió (misma clave sameConfiguration) sale en seco SIN sheet ni toast (antes preguntaba el alcance y mentía 'Cambios guardados'); si cambió, con qty>1 pregunta el alcance con cart_edit_scope_sheet — 'Solo 1' separa una unidad ADYACENTE a su origen / 'Las N' aplica a toda la fila — CartCubit.editItem devuelve CartEditOutcome y el toast lo cuenta: 'Cambios guardados' o 'Se combinó con la fila igual' (merge silencioso revisor-ui). Descarte con cambios sin guardar: PopScope cubre el back DEL SISTEMA (maybePop sí honra popDisposition) y la flecha usa _requestLeave manual (context.pop() de go_router bypasea PopScope — pop declarativo de página vía onPopPage→didPop): diálogo '¿Descartar los cambios?' con 'Seguir editando'/'Descartar'. Slug desconocido en edición → la vista dice 'Volver al carrito' (el pop cae al carrito). Modelo: CartItem gana snapshot includedNames ('Lleva:' del desplegable) y las filas added del reemplazo gratis llevan replacesOptionId→id del agotado (no entra a sameConfiguration: topping gratis y reemplazo gratis fusionan igual)."
  cart:
    route: "/home/cart (hija de la branch /home — conserva shell + nav, transición slideUp)"
    spec: "Carrito del pedido en construcción (§020, presentación — estado 100% local en CartCubit lazySingleton sobre el shell, sin persistencia MVP; pulido revisor-estetico + revisor-ui aplicado). Familia del detalle: Stack[SignatureStrip + Column[contenido + footer fijo] + flecha back fija onPrimary a 12/4]. Título 'Tu carrito' = patrón scrolling_title (widthFactor 0.602 naciendo del mostaza, dentro del scroll cuando hay ítems; la vista vacía lo fija en Column). Filas: un Dismissible endToStart por ítem (fondo = delete_outline error a la derecha) envolviendo cart_item_tile — straddle_card surfaceContainerLow radius 14 con ProductImage 80px FLOTANTE a caballo del borde izquierdo (Positioned left=cardLeft−kFrameOverhang, centrado vertical; mitad mostaza mitad card — mismo gesto que product_card, pulido estético). Contenido anclado al marco (padding-left = imageSize−overhang+kFrameTextGap=50): nombre titleSmall w700 (Anton — voz de producto) + unitPrice bodySmall α0.65 SOLO cuando quantity>1 (con 1 duplicaba el lineTotal) a la derecha; SIN resumen bajo el título (§021b, decisión del usuario — la línea 'sin X · +Y' se retiró y con ella cart_item_summary.dart): el nombre comparte fila con el chip 'Detalle' — píldora outlined compacta (borde outlineVariant radius 10, label labelSmall w600 α0.75 + chevron expand_more/less 14px primary DENTRO — el visual es pequeño pero el hit area conserva 40dp vía ConstrainedBox+Center) — es el único control del desplegable: Semantics container/button/expanded + label cartItemDetailToggle, hit area ConstrainedBox minHeight 40. unitPrice bodySmall α0.65 bajo el nombre solo cuando quantity>1. El panel entra/sale con AnimatedSize 180ms easeOutCubic top-anchored. Al abrir deja ver cart_item_detail_panel (§021b): secciones de la pantalla de personalización con título titleSmall Anton primary w800 (la firma de las secciones del detalle un paso más pequeña — decisión del usuario) e ítems en bullet — punto 6px primary alineado a la primera línea + texto bodySmall α0.8 con sangría francesa: 'Ingredientes' (snapshot includedNames), 'Se le quitó' (removeds, CON VÍNCULO del reemplazo 'agotado → reemplazo' vía replacesOptionId — esas filas added NO se repiten en Adicionales), 'Adicionales' (added group extra — o sin etiquetar, fallback de filas viejas — con ' +$X.XXX' primary cuando cobran), 'Toppings' (group topping), 'Salsas' (group sauce) — solo se pintan las que aplican; la sección viene de CartModifier.group (snapshot del set de origen, §021b — el panel no resuelve el producto en la carta); ítem vacío sin snapshot ni modifiers → línea 'Tal cual de la carta' para no quedar desnudo) + TextButton.icon 'Editar' primary 16px a la derecha → push /home/cart/edit con extra=CartItem (redirect a cartRoute si el extra no es CartItem — deep link/estado restaurado, revisor-ui); debajo Row[QuantityStepper (botones 44×44 icon 20 primary + tooltips l10n 'Quitar uno'/'Agregar uno' + Semantics 'Cantidad: N' con excludeSemantics en el número — targets reales, no shrinkWrap de 28px) + IconButton delete_outline 44px onSurface α0.55 tooltip 'Quitar del carrito' (affordance del swipe y vía sin gesto) + Spacer + lineTotal titleSmall primary w800]. Tres vías de eliminar (swipe, stepper − en 1, ícono) → todas pasan por removeItem + AppToast.info '{name} eliminado del carrito' (feedback mínimo ante destrucción sin deshacer — undo/banner queda pendiente UX). Cierre de lista: cart_browse_more_card — ghost card punteada (CustomPaint dash 6/gap 4, borde outlineVariant radius 14, SIN fill) en posición straddle con '+' primary α0.7 + '¿Se te antoja algo más?' bodyMedium w600 α0.7 centrados, tap → go(homeRoute); solo existe en lista no-vacía (decisión del usuario — DIRECCION revisor-estetico §020). Footer fijo opaco surface + borde superior outlineVariant (idéntico al detalle): 'Subtotal' bodySmall α0.7 + formatCop titleMedium primary w800 a la izquierda y FilledButton 'Ir a pagar' expandido PROVISIONAL → AppToast.info comingSoon hasta §021 checkout. §029: con StoreOpenState.closed del StoreStatusCubit el CTA se REEMPLAZA por store_closed_message (no disabled); unknown/open lo dejan pasar (la compuerta real es checkout/backend); initState dispara refresh() al entrar. Vacío: Column fija (no ListView — el Center en scroll no centra) con el view centrado dentro de la zona NEGRA (padding-left = strip; sin él se derramaba sobre mostaza): shopping_cart_outlined 44px primary α0.85 + 'Nada por acá todavía' (no repite el título) + 'Suma algo rico del menú' + FilledButton.tonalIcon 'Ver el menú' → go(homeRoute). Merge al re-agregar: mismo producto + MISMO conjunto de modificadores (clave optionId:action:priceDelta, orden irrelevante) suma cantidad en la misma fila — configuración distinta = fila aparte con id 'cart-<n>' determinista."
  checkout:
    route: "/home/cart/checkout (hija de cart — conserva shell + nav, slideUp; carrito vacío → redirect /home/cart)"
    spec: "Confirmación del pedido (§022 + revisión del usuario §022a, solo presentación — PROVISIONAL: datos mock, confirmación simulada; la integración llega por endpoint: /store/config, /addresses, POST /orders). Familia del carrito/detalle: Stack[SignatureStrip + IgnorePointer(todo, confirmInProgress) → Stack[Column[ListView + footer fijo] + flecha back fija onPrimary 12/4]]. Título 'Confirmar pedido' = patrón scrolling_title (widthFactor 0.602). Cuatro CustomizationSections en el orden del usuario: 1) 'Tipo de pedido' — segmented_toggle Local/Domicilio (§022b — 'Recoger en el local' → 'Local', decisión del usuario); pickup muestra ícono storefront + 'Lo recoges en' + store mock referencia (Depredadog — Costado norte del parque principal) + 'Te avisamos cuando esté listo'; domicilio lista CheckoutOptionRows (ícono por tipo + label + detalle + círculo check/radio) de ubicaciones guardadas mock como PUNTOS DE REFERENCIA (Casa 'Casa blanca frente a la cancha · Vereda El Carmen', Trabajo 'Segundo local del puente hacia arriba · Centro' — la zona no tiene nomenclatura de calles) + 'Nueva ubicación' como toggle de SOLO expandir/colapsar (§022d — el segundo tap ya NO desmarca ni restaura guardada: solo colapsa conservando la selección, vía CheckoutState.newAddressExpanded; desmarcar es tocar otra fila; los campos sobreviven y un confirm fallido reabre el form colapsado para mostrar el error) (AnimatedSize 180ms easeOutCubic): 'Punto de referencia *' ÚNICO REQUERIDO + 'Barrio o sector (opcional)' + checkbox 'Guardar esta ubicación' (mock) que al marcarse revela _AddressTypePicker con la física de la familia (§022b — el nombre solo sirve al guardar): label '¿Qué lugar es?' w600 + SelectChips Casa/Trabajo/Otro reutilizados de customization_section; 'Otro' revela CustomTextField 'Nombre del lugar' (hint 'Ej: casa de mi mamá') — estado newAddressType/newAddressLabel del cubit. CIERRE del bloque domicilio: hairline outlineVariant indent 14 + fila del PIN DE GOOGLE DEL PEDIDO (§022d — fuera del form: el punto exacto sirve para dirección nueva O guardada; botón outlined 'Adjuntar ubicación de Google' pin_drop 18px → estado adjunto: check primary + 'Ubicación adjunta' + link mock maps.app.goo.gl + close 'Quitar ubicación', Semantics label; cubit attachDeliveryLocation/removeDeliveryLocation → deliveryLocationLink order-level) + SEGUNDA hairline + división del CELULAR DE CONTACTO (§024 — 'dónde entrego' → 'a quién llamo'): 'Celular de quien recibe' espejo del campo Nequi (CustomTextField, keyboardType.phone, digitsOnly máx 10, AutofillHints.telephoneNumber, hint '3XX XXX XXXX'), prellenado con el phone de la cuenta y editable — quien recibe puede ser otra persona; controller sembrado desde el cubit (sobrevive al toggle Local↔Domicilio), estado contactPhone/showContactPhoneError. El aviso 'Domicilio gratis' se RETIRÓ de arriba de las direcciones (§022d — sobraba; el 'Gratis' del resumen lo dice donde importa) y checkoutDeliveryFreeNotice quedó muerta. 2) 'Observación' (§022a — renombrada y REUBICADA justo bajo Tipo de pedido) — TextField multilínea 2-4 líneas opcional, hint con ejemplo acorde a la zona ('p. ej. pago con billete de 50, traer cambio'). 3) 'Pago' — CheckoutOptionRow Nequi con el ÍCONO oficial (isotipo cuadro+#DA0081 + N #200020 — recorte del wordmark, §022b) sobre tile blanco 30×30 radius 7 (§022a: el wordmark #200020 se pierde en el tema oscuro — tile blanco, idioma de logos de pago; assets/images/nequi_logo.svg CC BY-SA 4.0, atribución en assets/ATTRIBUTION.md; SIN subtítulo — 'Te llega la notificación push' retirado por el usuario) que despliega el campo Celular Nequi PRELLENADO con el phone de la cuenta y editable (solo dígitos máx 10, regex ^3\\d{9}$; vacío→arranca vacío) + fila 'Pagar al recibir tu pedido' SOLO en domicilio (§022c, decisión del usuario — un pedido para el local que nadie recoge ya quedó hecho y nunca se cobró: pickup es PREPAGO; setOrderType a Local fuerza paymentMethod=nequi y setPaymentMethod rechaza onDelivery en pickup por defensa; en su lugar se muestra la nota 'En el local el pago es solo por transferencia' — NOTA informativa atenuada (info_outline_rounded 15px + bodySmall onSurface 0.6): explica la restricción sin competir con el highlight mostaza de 'Domicilio gratis'). 4) 'Tu pedido' — línea 'N× Nombre' … lineTotal por ítem (sin modificadores; nombre en titleSmall w700 — Anton), hairline, Subtotal, fila 'Domicilio' solo en delivery con valor 'Gratis' EN PRIMARY cuando fee=0 (§022a — dice gratis en vez de $0) o formatCop si cobra, TOTAL Anton primary w800. Footer fijo idéntico al carrito: 'Total' + valor + FilledButton 'Confirmar pedido' (spinner 22px onPrimary dentro durante el delay). Validación SOLO al confirmar e INLINE: domicilio exige ubicación elegida o punto de referencia (error por campo + sección) Y celular de contacto válido (§024 — requerido solo en domicilio; en Local el campo no existe en el árbol), Nequi exige celular válido — nada de toast; al fallar, foco/scroll al primer inválido en orden de pantalla (landmark→contacto→celular Nequi — patrón login/register). CheckoutOptionRow gana param leading (Widget) — logos de marca conservan sus colores, icon queda para Material teñido. Controllers del form siembran desde el cubit (sobreviven al toggle) y el checkbox recibe ensureVisible al expandir. El cuerpo pickup/domicilio transiciona con AnimatedSwitcher fade + AnimatedSize 180ms easeOutCubic; filas y píldoras exponen Semantics(selected, inMutuallyExclusiveGroup). Confirmación PROVISIONAL: delay mock 800ms (IgnorePointer total + spinner) → AlertDialog barrierDismissible:false con imagotipo_depredadog 72px (ExcludeSemantics), '¡Pedido confirmado!', 'Te avisamos cuando esté listo' (SIN número de orden — §022b: el consecutivo delata el volumen de ventas) + FilledButton ancho completo 'Ver mis pedidos' → pop + CartCubit.clear() + go(/home) compromete la branch y go(/orders) UN FRAME DESPUÉS. Dominio §022a: SavedAddress.street→landmark (punto de referencia), neighborhood opcional (detail sin separador colgante), CheckoutState.newLandmark/newNeighborhood/newLocationLink (pin adjunto mock, nullable con copyWith funcional), deliveryFee 0 en el mock store. §029: con el local cerrado confirmado (!store.isOpen del fetch propio OR storeClosedByRejection del 409 STORE_CLOSED) el FilledButton 'Confirmar pedido' se REEMPLAZA por store_closed_message — canConfirm y la guarda del cubit coinciden; confirmError queda vacío para ese código (el mensaje del slot ya dice el mismo copy); storeFailed conserva su banner con Reintentar (fetch fallido ≠ cerrado)."
  orders:
    route: "/orders (branch propia del shell — tab Pedidos) + hija :id (extra=CustomerOrder; deep link sin extra → /orders; slideUp). §031: /orders es PÚBLICA (el muro vive en el tab); solo /orders/:id está en protectedPrefixes."
    spec: "Tab Pedidos + detalle (§023, solo presentación — mocks en OrdersCubit LAZY_SINGLETON como CartCubit: tab y detalle comparten la MISMA instancia vía BlocProvider.value en ambas rutas — el detalle cancela y el tab refleja la migración; la fuente real será GET /orders del backend 015). §031 invitado: ListenableBuilder sobre AuthSession (ChangeNotifier) swappea en vivo — sin sesión el tab muestra auth_required_view centrado (receipt_long_outlined, copy voz de marca 'Aquí viven tus pedidos activos y tu historial — entra y síguelos el rastro.', CTAs push login/register con ?from=/orders) SIN disparar OrdersCubit; con sesión _AuthedOrders instala el cubit y dispara loadOrders en initState (cubre el swap muro→contenido con la página viva debajo del login). Tab: Stack[SignatureStrip + RefreshIndicator(400ms mock)→ListView] — 'Pedidos' scrolling_title como PRIMER hijo del scroll (en vacío se fija en Column). SIN heading 'En curso' (revisor-estetico: título pelado caía mostaza sobre franja mostaza). Cada pedido activo = SU PROPIA straddle_card (decisión del usuario): imagen del PRIMER ítem flotante a caballo del borde izquierdo (Positioned left=cardLeft−kFrameOverhang centrado vertical, imageSize 80 como cart_item_tile, padding-left 50; sin ítems → sin Positioned). Contenido: servicio (moped/storefront primary 18) + order_status_chip vivo + order_status_stepper (4 dots: pasados primary con check, actual relleno, futuros outlineVariant — GRÁFICA PURA sin caption, el chip ya nombra el estado; Semantics container 'Paso N de 4: …' conserva a11y) + resumen 'N× Nombre, …' maxLines 2 + entrega (delivery: place_outlined + 'Etiqueta — referencia' maxLines 1 + 'Con ubicación de Google' labelSmall primary si hasLocationPin; pickup: place_outlined + storeReference real — el icono ya no repite storefront) + pago (método+estado: 'Nequi · pagado' / 'Nequi · pago pendiente' / 'Pagas al recibir') + total titleSmall primary w800 + 'Cancelar pedido' TextButton error SOLO si isCancellable (Recibido = backend pending — la ventana del usuario; aire 10dp antes para que el hit area no invada el pago) → showOrderCancelDialog compartido (copy honesto 'El local aún no lo confirma — puedes cancelar sin problema', destructivo error/onError) → cancelOrder + AppToast.info 'Pedido cancelado' (feedback mínimo ante destrucción — convención de la familia). 'Historial' = CustomizationSection con order_history_tile: fila-pill Material+InkWell radius 10 (servicio α0.55 18px + fecha 'N nov · h:mm a. m.' + 'N ítems' + total primary w800 + chip MUTED bgFade 0.55/fgFade 0.8 — terminal legible, contraste corregido por revisor-ui + chevron α0.65) → push /orders/:id extra=order. Cancelar migra activo→tope del historial como cancelled. Vacío: recibo primary + título + sub + FilledButton.tonalIcon 'Ver el menú' → /home (gaps 12/4/16 — alineado a cart_empty_view). DETALLE: Stack[SignatureStrip + ListView + flecha back fija onPrimary] — 'Detalle del pedido' scrolling_title primer hijo. Secciones CustomizationSection: 'Estado' ('Pedido el …' — placedAt prefijado, año solo si ≠ en curso: no se lee como fecha del cambio + chip + stepper [ausente en cancelled] o razón error α0.8 + 'Cancelar pedido' error cuando isCancellable → mismo diálogo → cancel+toast+pop); 'Tu pedido' (_ItemLine: 'N× Nombre' + unitPrice bodySmall α0.65 SOLO qty>1 + chip 'Detalle' píldora outlined+chevron 14px primary IDÉNTICA al cart tile → AnimatedSize 180ms → order_item_detail_panel por secciones Ingredientes/Se le quitó(→reemplazo)/Adicionales/Toppings/Salsas con puntos mostaza y +precio primary — MISMA estructura CartModifier+includedNames del CartItem, 1:1 order_item_modifiers del backend; solo lectura, sin Editar + divider + totales Subtotal/Domicilio-'Gratis' primary/Total); 'Entrega y pago' (servicio + etiqueta/referencia/barrio/pin-check primary + línea 'Recibe: 3XX XXX XXXX' con phone_rounded 16px muted — §024, solo delivery con contactPhone, máscara simple; o storeReference + método: 'Pagas al recibir' en vivo, 'Pagaste al recibir' si isTerminal — tiempo verbal honesto); 'Observación' (solo si note). SIN 'volver a pedir' ni paso 'en camino' (decisiones del usuario MVP). Mocks: ord-1 delivery preparing Nequi pagado+pin+contacto, ord-2 pickup received Nequi pendiente (cancelable), ord-6 delivery confirmed EFECTIVO contra entrega con contacto de otra persona (el efectivo solo existe en domicilio §022c); historial: done delivery/done pickup/cancelled con razón."
  profile:
    route: "/profile (branch del shell — tab Perfil) + hijas push: /profile/data, /profile/addresses (+ /new y /edit?addressId=), /profile/store, /profile/password. §031: /profile y /profile/store son PÚBLICAS (la info del negocio es vitrina); data/addresses*/password están en protectedPrefixes."
    spec: "Tab Perfil del cliente (§030 + §030.1, solo presentación — mocks de ProfileCubit/ProfileAddressesCubit/ProfileStoreCubit lazySingletons compartidos vía BlocProvider.value entre madre e hijas, patrón OrdersCubit; las integraciones son §031+/pendientes). §031 invitado: mismo ListenableBuilder que orders — sin sesión el tab muestra _GuestProfile = scroll con wall-card straddle (auth_required_view iconSize 64 person_outline_rounded, copy 'Tus datos, direcciones y puntos de la manada te esperan.', CTAs ?from=/profile) + sección 'El negocio' con las 2 filas públicas (El local → /profile/store, Soporte → diálogo) — decisión del usuario: la vitrina del negocio no exige cuenta; sin identidad/loyalty/'Mi cuenta'/logout y los cubits de cliente ni se resuelven. Stack[SignatureStrip + ListView] — el tab no lleva flecha. Contenido autenticado: 'Perfil' scrolling_title_tab → profile_identity_card (avatar iniciales + nombre + email + celular con máscara) → profile_loyalty_card (puntos + info_outline → diálogo '¿Cómo funciona la manada?' + código copiable + referidos) → sección 'Mi cuenta' (profile_section_label): Mis datos badge_outlined → /profile/data, Mis direcciones location_on_outlined con subtítulo vivo 'N guardadas' del ProfileAddressesCubit (revisor-ui: era mock fijo =3 — ahora coincide si creas/borras en sesión) → /profile/addresses, Cambiar contraseña lock_outline → /profile/password → sección 'El negocio': El local storefront_outlined → /profile/store, Soporte support_agent_outlined opensDialog (sin chevron) → diálogo WhatsApp copiable → 'Cerrar sesión' logout_outlined destructive como ÚLTIMO ÍTEM del scroll (decisión del usuario: era footer anclado; con el menú completo el peligro vive al final de la lista) → logout_confirm_dialog → cubit stub + AppToast 'Muy pronto podrás cerrar sesión' (una acción destructiva confirmada nunca muere en silencio, revisor-ui; POST /auth/logout llega en §033)."
  profile_data:
    route: "/profile/data (hija push de /profile)"
    spec: "'Mis datos' — form de datos personales (§030.1, mock: save llama ProfileCubit.updateUser + toast 'Datos actualizados' + pop). Shell form de la familia: scrolling_title + flecha back onPrimary fija + straddle_card contenedora (padding simétrico 14/12 — el 6 inferior se corrigió a 12, revisor-estetico). Campos CustomTextField: primer nombre*, primer apellido*, segundo apellido (opcional), celular (digitsOnly 10, TextInputAction.done — 'siguiente' saltaba a un campo muerto, revisor-ui; error accionable 'Celular de 10 dígitos que inicia en 3'), correo electrónico READ-ONLY (enabled:false — label atenuado onSurfaceVariant + helper 'El correo no se puede cambiar'; cambiarlo exigiría re-verificación, fuera de alcance aun en backend futuro). Primario 'Guardar cambios' valida inline."
  profile_password:
    route: "/profile/password (hija push de /profile)"
    spec: "'Cambiar contraseña' — form mock de 3 CustomTextField obscure con ojos independientes (§030.1): 'Contraseña actual' hint 'Escribe tu contraseña' (copy del usuario — 'La que usas hoy' rechazado), 'Nueva contraseña' hint 'Mínimo 8 caracteres' (regla del registro/backend — el error ES la regla), 'Confirmar contraseña' hint 'Repite tu contraseña'. Validación inline (requeridos + min 8 + coinciden) → mock save: toast 'Contraseña actualizada' + pop. El endpoint real va en pendientes/013 del backend."
  profile_store:
    route: "/profile/store (hija push de /profile)"
    spec: "'El local' — info del negocio (§030.1): straddle_card con nombre 'Depredadog' + chip abierto/cerrado REAL (reusa StoreStatusCubit del shell §029 — gratis; unknown oculta el chip, nunca miente) + mini-label 'Horario' w600 + 7 días en 12h es-CO ('5:00 p. m. – 11:00 p. m.', formatHours del widget — el 24h crudo del backend desentonaba con '12:40 p. m.' de pedidos; hoy resaltado primary w600, días cerrados no-hoy atenuados α0.5 — el color ya significa: hoy=mostaza, revisor-estetico) + hairline + dirección + teléfono con IconButton copy (Clipboard + toast 'Número copiado'). Datos de la card = mock sobre entidad StoreInfo/StoreDayHours con la forma real de GET /store/config (la integración solo agrega el use-case — el datasource de store hoy solo parsea isOpen)."
  profile_addresses:
    route: "/profile/addresses (hija push de /profile) + /new y /edit?addressId= (nietas del cubit compartido)"
    spec: "Gestión de direcciones (§030, mutaciones optimistas mock del ProfileAddressesCubit singleton — SavedAddress +isDefault agregado en §030, ripple al model de checkout que no lo tenía: el checkout solo necesitaba 'la primera'). Lista: scrolling_title + tiles straddle_card (avatar-iniciales del label en tile mostaza + nombre + referencia + badge 'Predeterminada' píldora secondaryContainer cuando isDefault + ⋮ menú: Marcar predeterminada (exclusividad — solo una; idempotente) / Eliminar → confirm dialog; borrar la default → la primera restante la hereda, invariante 'una sola default', revisor-ui; tap en card → edición). Vacío: card fantasma + copy + CTA. Form compartido new/edit (address_form_screen, edit prellena): chips tipo Casa/Trabajo/Otro (SelectChip de customization_section; 'Otro' revela 'Nombre de la dirección' — Casa/Trabajo auto-etiquetan; cambiar de chip lava _showErrors para que el campo revelado no nazca con error, revisor-ui) + 'Punto de referencia *' (hint 'Ej: casa blanca, reja negra' — se acortó porque truncaba a media palabra, revisor-estetico; benefició también al checkout que comparte la clave) + 'Barrio o sector (opcional)' + checkbox predeterminada. Validación inline + errores genéricos. Soporte: diálogo con kSupportPhone PLACEHOLDER copiable (+57 300 000 0000 — pendientes/012 backend: store_settings.support_phone; la integración lo toma del mismo fetch del local)."
  admin_queue:
    route: "/admin (4ª branch del shell — tab Cocina; SOLO rol admin: el destino del nav es condicional y el guard exige sesión+rol — invitado → /login?from=, cliente → /home)"
    spec: "Tablero KANBAN del dueño (§036 — la cola deja de ser lista+filtro del §034): AdminQueueCubit LAZY_SINGLETON ya 100% REAL (§038 cola, §039 detalle, §040 status, §041 cobro+cierre — los mocks solo viven en fixtures de test). 5 carriles Pendiente|Confirmado|Preparando|Listo|Entregado — un carril por página del PageView, navegación por swipe o tap en chip; `done` vive en su carril hasta el CIERRE DE CAJA manual, solo `cancelled` cruza al historial provisional (🕐 → /admin/history). Es tab — sin flecha ni muro de invitado. Stack[SignatureStrip + RefreshIndicator→NestedScrollView]: HEADER EN EL SCROLL (decisión del dueño — _QueueHeader: IconButton.filledTonal point_of_sale + Badge con entregados → /admin/day-close flotando sobre la franja en el slot 0.398·ancho — MISMO origen del título naciente, título 'COCINA' headlineSmall primary w800 pegado al filo, IconButton history_rounded → historial) colapsa al bajar y SIN floatHeaderSlivers solo regresa cuando el PRIMER pedido llega al tope y lo empuja — un toquecito no lo reflota (decisión del dueño). Body = Column[AdminLaneStrip FIJO como fila de layout — no overlay: las cards se cortan limpio en su filo y nada pasa debajo — sobre BANDA scaffoldDark #000000 de ancho completo que tapa la franja firma en esa fila (chips scrolleables full-width; el §034c de primario-sobre-mostaza no aplica: nada pinta sobre mostaza), centrados cuando caben (ConstrainedBox minWidth=viewport + Row center) y ensureVisible centra el chip activo → Expanded(_QueueBoard: PageView de AdminQueueLane)]. LaneStrip: 5 chips label+count radius 10, hit ≥44dp — activo primary α0.16 + borde primary + píldora count primary/onPrimary w800, inactivo surfaceContainerHigh + count onSurface α0.12; Semantics selected+inMutuallyExclusiveGroup. Flecha 'volver al inicio' (decisión del dueño): FloatingActionButton.small tonal surfaceContainerHigh→primary cheurón sobre el FAB, AnimatedSwitcher scale 180ms, visible tras ~560px de scroll del carril (ScrollNotification depth≥2 del inner compartido) — anima inner+outer a 0 y se retira sola; se resetea al cambiar de carril. FAB '+' primary/onPrimary 'Nueva orden' → toast provisional (form presencial = ciclo 3). Card = straddle_card de la familia orders (imagen del PRIMER ítem a caballo, imageSize 80): fila [AdminServiceTypeChip del servicio (Domicilio/Recogida/Mesa sobre secondaryContainer) ⋯ AdminChannelTag a la derecha — susurro SIN píldora: smartphone 'Online' / storefront 'Presencial' icono+label apagados, cede con Expanded+ellipsis en angosto y el ícono sobrevive] → fila cliente (person_outline + nombre del registrado, o 'En el local · Mesa N' / 'En el local' mostrador + 'hace N min' de AdminElapsedText con ticker 60s) → resumen ítems con '+N más' honesto (TextPainter + maxLines 2) → fila pago (glifo por método — payments 'Efectivo' / sync_alt 'Transf.' / credit_card 'Nequi' — + AdminPaymentStatusChip Pagado/'Pago pendiente'/'Pago fallido', se suprime en cancelled) + total titleSmall primary w800 → SLOT DE ACCIÓN por matriz canal×servicio×método×pago (adminOrderNextAction del cubit, contrato de la 022): received → 'Confirmar' EXCEPTO puertas — presencial+pickup sin cobrar → 'Registrar pago' que cobra Y avanza (received→confirmed: el cobro era el único bloqueo); online+pickup SOLO admite Nequi (el fantasma que no recoge cuesta producción) y como TODO Nequi queda CONGELADO hasta el webhook: pending → rótulo hourglass 'Esperando confirmación de Nequi…' SIN botones, failed → 'Nequi rechazó el pago — cancela el pedido' (su única salida es cancelar); confirmed → 'Preparar'; preparing → 'Listo'/'Listo p/recoger'; ready sin cobrar → 'Registrar pago' → done directo, pagado → 'Entregado'/'Va en camino'; terminal → sin acción (detalle read-only). Nacimiento coherente: online siempre received; presencial dineIn/delivery nace confirmed (lo creó el dueño); presencial pickup nace received aunque venga pagado. Tap en card → /admin/orders/:id. Pull-to-refresh, spinner primera carga, vacío global soup_kitchen + copy de marca, error página sin datos o fila inline con datos. COLA POR CARRIL (§037 — decisión del dueño, reemplaza el FIFO por placedAt): la posición dentro del carril es cuándo entró a ESTE estado — sort por statusChangedAt (AdminOrder), nacidos en el estado usan placedAt; el recién movido cae al fondo, no se cuela por antigüedad. Datos REALES desde §038/§039 (GET /admin/orders + detalle que hidrata modifiers; los mocks viven solo en fixtures de test). AdminOrder = OrderResponse + channel/tableLabel/customerName — status/payment reusan los enums del cliente y paymentMethod agrega nequi. MOTION (fix UX §040 — decisión del dueño 'sale animado + chip pulsa', sin auto-navegación): el carril es AnimatedList con diff por id — el pedido que avanza o se cancela COLAPSA hacia arriba + fade ~320ms (saliente IgnorePointer sobre el objeto capturado), el que llega crece desde el tope + fade easeOutCubic; el chip del carril que gana/pierde conteo PULSA ~450ms (chip 1→1.06→1 + badge del número 1→1.22→1, un reloj, solo cuando count cambia en didUpdateWidget) — señala a dónde cayó sin mover la pantalla; el mensaje de carril vacío es capa en crossfade 250ms BAJO la lista (monta solo con carril vacío), y el dif conserva el primary:true del inner compartido del NestedScrollView. CIERRE REAL (§041 — nada queda provisional): 'Registrar pago' → POST /admin/orders/:id/confirm-payment (cobra Y avanza en el mismo hecho atómico del backend; conflicto → toast 'ya cambió' + resync, resto → 'No pudimos registrar el pago') y /admin/day-close deja de simular: GET al entrar pinta el preview del servidor, error → _DayCloseError familia _QueueError (cloud_off + 'No pudimos cargar el cierre' + Reintentar — antes spinner eterno) y el CTA 'Confirmar cierre' queda DESHABILITADO sin resumen visible (revisor §041 — no se cierra a ciegas); POST ejecuta el cierre, el éxito pinta el SNAPSHOT DEL SERVIDOR (no el preview), los done salen del carril al frente del historial con la animación del diff y falla → toast 'No pudimos cerrar la caja' + se queda en el preview (decisiones del dueño)."
  admin_order_detail:
    route: "/admin/orders/:id (hija push de /admin — slideUp; extra=AdminOrder + BlocProvider.value del AdminQueueCubit singleton, patrón Orders §027)"
    spec: "Detalle del pedido para el dueño (§035 — híbrido card+detalle, decisión del usuario): tap en la card abre TODO lo que la cola resume. Stack[SignatureStrip + Column]: Expanded(ListView) con _DetailTitle 'Detalle del pedido' + AdminOrderDetailHeader (sección Pedido: canal/estado chips + cliente o 'En el local · Mesa N' + hace N min + #id corto — formato #adm-N APROBADO como definitivo, solo lo ve el dueño) + AdminOrderNoteSection (§037 — Observación justo bajo Pedido: CustomizationSection + body w600 'ordena, no informa'; se omite si note null o trim vacío) + AdminOrderDeliverySection (§037 — sección Entrega en domicilio Y recogida, NO en mesa: etiqueta+barrio muted vs LANDMARK en tinta plena — la zona sin nomenclatura hace del referencia la dirección real; pin 'Con ubicación de Google' ACCIONABLE: con locationUrl/coords el tap abre Maps via url_launcher + IconButton copia el enlace + toast — maps.app.goo.gl verbatim tiene prioridad sobre reconstruir lat/lng, decisión del dueño; pickup dice 'Lo recogen en el local' + teléfono del cliente por la regla del fantasma; _PhoneRow ≥44dp + Semantics 'Copiar teléfono' copia al portapapeles) + AdminOrderDetailItems (sección Ítems: UNA fila por ítem con qty×nombre + unitPrice + line total — los 7 de Mesa 5 completos; ítems CON modificadores nacen DESPLEGADOS mostrando OrderItemDetailPanel Ingredientes/Se le quitó/Adicionales/Toppings/Salsas — 'sin cebolla' es instrucción de cocina; perro estándar ni siquiera gasta chip 'Detalle'; desglose honesto: Subtotal+Domicilio+Total solo cuando hay fee, mesa/pickup deduplican subtotal==total — misma regla en detalle cliente §023; total atenuado α0.5/w600 en cancelado) + AdminOrderDetailPayment (sección Pago: método + chip estado + 'Registrar pago' tonal SOLO cuando es operación distinta del primario — §036: Nequi pending/failed nunca lo ofrece, el cobro lo certifica el webhook no el dueño; si el primario ya es markPaid se suprime, eco de composición revisor-estetico; en CANCELADO la sección entera se omite — card-título huérfana, revisor-ui) + FOOTER FIJO OPACO (decisión del usuario tras DIRECCION del estético — el CTA nacía de la franja y quedaba bajo el fold en Mesa 5): Column[Expanded(ListView bottom-24) → DecoratedBox(surface + Border(top outlineVariant)) → SafeArea(top:false)] patrón idéntico cart/checkout — el primario siempre al alcance del pulgar, la franja no sangra, en terminal el footer se desmonta entero (detalle read-only). Contenido del footer (AdminOrderDetailActions): primario de la matriz canal×servicio×método×pago compartida con la card (adminOrderNextAction §036: terminal→null, Nequi pending→NINGÚN botón — el webhook manda, Nequi failed→solo cancelar, presencial+pickup sin cobrar→markPaid que cobra Y avanza a confirmed, received→confirm, ready sin cobrar→markPaid→done, ready pagado→markDone) + cuando la puerta de pago bloquea el siguiente paso, este se muestra DESHABILITADO visible + pista candado 'Registra el pago primero' (adelanta el 409 PaymentNotSettled del backend en vez de esconder la regla) + 'Cancelar pedido' text-button error → diálogo obligatorio con motivo opcional SIN autofocus (el teclado no abre solo) — lo destructivo solo vive acá. Busy: el CTA sigue mostaza con spinner onPrimary inline + IgnorePointer + guarda de re-entrada en _mutateOrder (convención checkout elevated_button_primary — el botón no se apaga). Toasts de éxito por acción; terminal/cancelado swap de bucket a la cabeza del Historial."
  admin_new_order:
    route: "/admin/orders/new (hija push de /admin — FAB '+' de Cocina; AdminNewOrderCubit FACTORY: cada entrada abre borrador limpio)"
    spec: "Comanda presencial del dueño (§042 — toma el pedido de mostrador/mesa desde la app; consume GET /admin/tables + POST /admin/orders reales). DOS PASOS UNA RUTA (decisión del dueño — 'primero qué va a llevar, después para quién y cómo paga'): ComandaStep | CobroStep con AnimatedSwitcher 200ms; PopScope canPop false — el back NATIVO corre el mismo camino que la flecha (cobro→comanda con el borrador intacto, comanda→pop; sin él la ruta entera salía y el borrador se destruía en silencio, revisor-ui CRÍTICO). Stack[SignatureStrip + Column(Expanded paso + footer fijo)]: flecha back onPrimary Positioned top:12 left:4 (geometría §035/§036). COMANDA: NestedScrollView con NewOrderTitle scrolleable (scrolling_title naciente 0.602, headlineSmall primary w800, padding 12/16/16/16 — el respiro bajo el título despeja el área de toque de la flecha de la banda de chips, iteración del dueño 'la barra y la flecha quedaron muy juntas') + AdminChipBand FIJADA como fila del body (banda negra full-width compartida con el strip de Cocina — la extrajo el revisor de código: la banda duplicada verbatim) con chips AdminFilterChip (mismo widget del lane strip: label+count, activo primary α0.16+borde, hit ≥44dp) por categoría + 'Todo' — la categoría vacía muestra 'Sin productos en esta categoría' en zona negra (antes hueco negro mudo, revisor-ui). Lista straddle de la familia: ProductPickRow con la IMAGEN 64dp (kPickRowImageSize — antes 56, revisor-estetico) centrada sobre la costura mostaza/negro y TEXTO completo en negro (nada se imprime sobre mostaza, regla §034c); divisores hairline solo ENTRE filas y solo en zona negra (left: imageSize+4). Affordance '+' = círculo mostaza 30dp canónico del catálogo (el ícono pelado desentonaba, revisor-estetico); con unidades la fila muestra stepper rápido − N + de hit 44dp real (antes 32, revisor-ui — el + repite la última config, otra personalización se pide tocando la fila); producto agotado = fila habilitada-atenuada con píldora errorContainer 'Agotado' canónica §019 (no desaparece: se ve, se entiende, no se toca). Tap → ItemCustomizeSheet: bottom sheet compacto (shape del cart_edit_scope_sheet) con qty stepper, 'se le quita' (check=incluido/−=quitado), 'le agregamos' (+$ por opción, isSellable deshabilita con 'Agotado'), Toppings y Salsas en chips, y CTA 'Agregar · $total' PINEADO en footer opaco con hairline (antes caía bajo el fold, revisor-ui) — devuelve el CartItem armado (modelo compartido con el carrito: serializa 1:1 a order_item_modifiers del backend). COBRO: secciones PLANAS en zona negra (revertido el straddle — 'Servicio'/'Pago' labels+chips se camuflaban sobre mostaza, iteración del dueño) + la card del TICKET stradlea sola (ícono por ítem + qty stepper 44dp + trash + line total + 'Detalle' expandible con mods); chips servicio Mesa/Para llevar; TablePicker con mesa libre habilitada / ocupada disabled mostrando su '#N' de orden activa (el backend permite un solo pedido vivo por mesa — no se crea lo que va a rechazar) / inactiva atenuada; chips pago Efectivo/Transf.; Transf. revela celular pagador con AnimatedSize + CustomTextField compartido (error tras blur, no desde el primer keystroke — valida ^3\\d{9}$ colombiano) — el AnimatedSize reemplazó al swap seco (pulido); nota 'Nota (opcional)' 0/500 (acortada: 'Nota del pedido (opci…' truncaba a media palabra, revisor-estetico). FOOTER §020 — patrón del carrito: resumen a la izquierda (conteo ICU '1 ítem'/'N ítems' bodySmall α0.7 + total titleMedium primary w800) y ACCIÓN limpia a la derecha en Expanded — el dato y el CTA no se funden en un solo botón (decisión del dueño: 'ítem y continuar no deben ir uno mismo'). Comanda: 'Continuar' disabled sin ítems → goToCobro. Cobro: 'Crear pedido' disabled hasta canSubmit (mesa si dineIn, celular válido si Transf.) → POST /admin/orders; durante el submit la pantalla entera va IgnorePointer y el botón NO se apaga a gris — queda primary con spinner onPrimary 18dp (patrón §035, revisor-ui — la re-regresión del §035 que ya se había corregido en el registro); footer oculto en loading/failed (CTA '0 ítems' disabled bajo el spinner es ruido). Éxito → toast 'Pedido #N creado' + AdminQueueCubit.load() + pop — cae animado al carril Confirmado (dineIn) o Pendiente (pickup). Errores por errorCode unificado en AdminFailure (getter — el switch duplicado cubit/pantalla lo unificó el revisor): ORDER_CATALOG_VIOLATION/TABLE_NOT_FOUND → toast 'la mesa cambió' + resync de mesas que SUELTA la selección si quedó ocupada (revisor), PAYMENT_DISPATCH_FAILED → toast específico, demás → toast de la cola; la pantalla se QUEDA (no pop en error). context.read jamás en build — los callbacks leen el cubit en el momento del gesto (revisor)."

changelog:
  - version: "1.40.0"
    date: 2026-11-20
    page: "admin_new_order + admin_order_detail (§043 — 'Enviar a cocina': comanda como card PNG por ítem al share sheet)"
    status: "completed"
    changes:
      - "Compartir pedido a cocina por WhatsApp: una card-imagen por ítem (RepaintBoundary offscreen → PNG temporal → share_plus). Cocina lee la comanda desde el chat, sin app. V1 de texto wa.me descartada por el dueño en gate visual."
      - "kitchen_item_card: 600px surface, header 'PEDIDO #n · i/n', ítem Anton + secciones Se le quitó (con 'X → reemplazo' del cambio gratis) / Ingredientes / Adicionales (×N §045) / Toppings / Salsas, footer servicio+pago+nota+total, marca de agua Depredadog. Sin foto ni precios por mod (decisión del dueño)."
      - "Disparadores: tras crear comanda (borrador, fromCartItems) y el ícono share del detalle (fromAdminOrder, pedido hidratado) — ambos busy-state. Deps nuevas: share_plus + path_provider. Toast adminShareWhatsAppFailed cubre fallo de plataforma."
      - "Aprobada por el dueño — sale con ×N de extras por el mapper compartido (§045). Tests 788 — analyze 0 issues."
  - version: "1.39.0"
    date: 2026-11-20
    page: "product_detail + admin_new_order (§045 — adicionales por porciones: cualquier ingrediente se repite como extra cobrado)"
    status: "completed"
    changes:
      - "Regla de negocio del dueño: la gente repite ingrediente pagándolo como adicional, por porciones y sin tope. additionalOptions pasa a !includedByDefault || extraPrice>0 — la carta completa de adicionales (10) se ofrece en cada perro; pan/salchicha quedan fuera por precio 0. Backend §026: times en OrderItemModifierDto (int≥1 opcional, added cobra extra×N; removed/replace 1:1)."
      - "Widget nuevo extra_stepper_row: nombre maxLines 2 + trailing '+$X.XXX' (extra×N al seleccionar, 'Gratis' si price=0) + stepper −N+ reusado del carrito. Sustituye al OptionRow en '¿Le agregamos algo más?' y en el sheet de Nueva orden presencial — el dueño también vende dobles desde Cocina."
      - "Guard de conflicto: quitar un ingrediente limpia su extra y deshabilita su fila (el backend rechaza removed+added del mismo optionId con duplicate modifier). Reemplazos gratis excluyen incluidas (una incluida no puede 'reemplazar' lo que ya lleva el perro)."
      - "Propagación times end-to-end: DetailSelections.extras Set→Map<optionId,porciones>, CartModifier.times, payload de la orden ('times' siempre), parseo de la respuesta, '×N' en el panel del carrito y en la card de cocina cuando N>1; priceDelta = total de línea como en el servidor."
      - "Aprobado visualmente por el dueño en emulador (incluido+extra coexisten, ×2 actualiza precio y total, quitar deshabilita la fila, Cocina con el mismo stepper). Tests 788 — analyze 0 issues."
  - version: "1.38.0"
    date: 2026-11-20
    page: "admin_new_order (§042 — comanda presencial: el FAB de Cocina toma pedidos de mesa/mostrador y caen reales a la cola)"
    status: "completed"
    changes:
      - "Pantalla nueva /admin/orders/new — DOS PASOS UNA RUTA (decisión del dueño): comanda (productos + personalización en ItemCustomizeSheet compacto con CTA pineado) → cobro (ticket editable + Mesa/Para llevar + TablePicker con ocupada disabled mostrando '#N' + Efectivo/Transf. con celular pagador revelado + nota 500). Cierra el pendiente app/013 — el FAB '+' dejó de ser dead-end."
      - "Geometría iterada en vivo con el dueño: banda de categorías como el strip de Cocina (AdminChipBand negra full-width fijada + AdminFilterChip compartido con conteo — la extracción eliminó la duplicación verbatim, revisor de código); lista straddle con la imagen 64dp sobre la costura y el texto en negro; el título scrollea y la banda no. Cobro: secciones planas en negro (el straddle camuflaba labels/chips) y solo la card del ticket cruza la franja; respiro 16px bajo el título para que la banda no pegue con la flecha."
      - "Footer §020 (decisión del dueño 'ítem y continuar no deben ir uno mismo'): resumen izquierda (conteo ICU '1 ítem'/'N ítems' + total primary w800) + acción limpia derecha — el dato y el CTA ya no se funden en un solo botón."
      - "Revisor-ui: 3 CRÍTICOS + 6 IMPORTANTES corregidos — CTA que no se apaga a gris en submit (IgnorePointer + spinner onPrimary, misma regresión §035), PopScope para el back nativo (cobro→comanda sin perder el borrador), stepper 44dp, estado vacío de categoría, píldora 'Agotado' canónica §019, CustomTextField con error tras blur, CTA del sheet pineado, números mágicos extraídos (kPickRowImageSize), plural ICU '1 ítem'."
      - "Revisor de código (APROBADO CON OBSERVACIONES): errorCode unificado como getter en AdminFailure (adiós al switch duplicado), submitting liberado en éxito, mesa stale se suelta en el resync TABLE_NOT_FOUND, context.read fuera de build, clave l10n muerta y comentario stale del FAB eliminados."
      - "Verificado en emulador + base: POST /admin/orders 201 real — El Coyote con 'Chile con carne→removed' + 'Piña en trozos→added' persistió en order_item_modifiers, unit_price $20.500 calculado por el servidor, la orden cayó animada al carril Confirmado con channel presencial y taken_by del admin. Tests admin: 205 — analyze 0 issues."
  - version: "1.37.2"
    date: 2026-11-18
    page: "admin_queue (§041 — cobro y cierre de caja REALES: el último tramo provisional de Cocina)"
    status: "completed"
    changes:
      - "'Registrar pago' deja de ser local: POST /admin/orders/:id/confirm-payment — el backend cobra Y avanza atómico (pending+presencial+pickup→confirmed, ready→done, idempotente en paid). Gates del cubit intactos como no-op (terminal / Nequi — el webhook manda / ya pagado); busy por pedido y _replaceOrder compartido con el PATCH. Falla → 'No pudimos registrar el pago' específico; conflicto 409 → 'el pedido ya cambió' + resync (decisiones del dueño)."
      - "Cierre de caja real: GET /admin/day-close alimenta el preview (los números son del servidor, no del cliente) y POST /admin/day-close ejecuta — éxito pinta el snapshot del POST (que puede diferir del preview si algo terminó en el medio), los done archivan al frente del historial con la animación del AnimatedList y el badge del ícono se apaga; falla → toast 'No pudimos cerrar la caja' y la pantalla se QUEDA en el preview (decisión del dueño). Campo note del backend diferido (sin demanda)."
      - "Corrección del revisor: sin el preview cargado el CTA quedaba habilitado — cierre a ciegas sin ver el resumen. Ahora onPressed null (botón apagado) durante carga y error; test de regresión cubre disabled→enabled tras Reintentar."
      - "Estados de error nuevos en la pantalla del cierre: _DayCloseError (familia _QueueError — cloud_off + 'No pudimos cargar el cierre' + OutlinedButton Reintentar) cuando el GET falla — antes spinner eterno. Verificado en emulador: cobro real mueve pickup→Confirmado, preview idéntico al curl del servidor, dos cierres persistidos en day_closes con sus day_close_id. Tests admin: 158."
  - version: "1.37.1"
    date: 2026-11-18
    page: "admin_queue (fix UX §040 — transiciones de carril visibles: salida animada + chip que pulsa)"
    status: "completed"
    changes:
      - "Feedback del usuario en vivo: 'cuando se mueve un pedido no hay animación que se vea fluido — se va de golpe'. Decisión del dueño entre 3 opciones: 'sale animado + chip pulsa' (descartadas 'viaja con el pedido' — arrastra la pantalla procesando varios del mismo carril — y 'solo sale animado' — sin señal de destino)."
      - "AdminQueueLane: ListView→AnimatedList con diff por id en el State — saliente colapsa hacia arriba + fade ~320ms (SizeTransition alignment topCenter + FadeTransition, objeto capturado, IgnorePointer para no tappear una orden migrada), entrante crece desde el tope + fade easeOutCubic, ítem en sitio solo refresca el objeto; blindaje de orden si el servidor re-ordena."
      - "El 'Sin pedidos' del carril deja de ser un swap de widget con corte seco: capa en crossfade 250ms bajo la lista — se revela mientras la última card colapsa; monta solo con carril vacío (un opacity-0 sigue en el árbol y en los finders)."
      - "_LaneChip→StatefulWidget: pulsa cuando count cambia en didUpdateWidget — chip completo 1→1.06→1 + badge del conteo 1→1.22→1 en el mismo AnimationController 450ms; no repite en builds sin cambio de conteo; el primary:true del inner del NestedScrollView se conserva (el 'volver al inicio' sigue animando todos los carriles)."
      - "Misma iteración integra §038-040: spec actualizado de 'mocks' a datos reales (GET /admin/orders + PATCH status + detalle hidratado); test nuevo verifica que la card sigue en el árbol a mitad del colapso (no teletransporta). Tests admin: 128."
  - version: "1.37.0"
    date: 2026-11-15
    page: "admin_order_detail (§037 — detalle operativo completo: entrega con pin accionable, observación, ítems auto-expandidos, desglose honesto) + admin_queue (cola por carril)"
