      - "Detalles de la crítica revisor-ui (2 ciclos): hit area ≥44dp + Semantics button en links de footer (register y login); límite silencioso de caracteres en inputs con regla de largo; stepper fijo fuera del scroll; scroll reset + AnimatedSize por paso; paso 3 top-aligned; bloqueo de flecha/back nativo durante submit (homologado con verify_email); guard isInProgress en field-changes del cubit; segundo apellido sin autofillHint duplicado."
      - "Infra Android: network_security_config.xml nuevo — cleartext http SOLO para 10.0.2.2/localhost en dev (prod sigue exigiendo https); necesario para que el build release hable con el backend local."
      - "Tests: register_cubit_test (reglas de inputs, navegación de pasos, submit simulado) + register_screen_test (render por paso, errores, navegación, preservación de datos) — 94/94 suite total."
