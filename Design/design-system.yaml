    status: "completed"
    changes:
      - "Home real (§017, presentación — sin domain/data): selector de categorías sobre signature_strip mostaza 40% que corre detrás de todo el scroll. Categorías Perros/& Más/Bebidas/Combos con tap → /home/category/:id o toast en vacías."
      - "Familia straddle_card (§017): TODA card cruza el límite franja↔negro (left = strip·kCardStripInset 0.5, margen derecho simétrico blackZoneMargin — conjunto centrado en pantalla, feedback del usuario 'mucho espacio a los lados'). Imagen flotante a caballo del borde + texto anclado a 14dp de la imagen (eje universal borde-franja+16 ELIMINADO por el usuario — dejaba ~40dp de aire) + chevron 18dp con 16dp de padding (antes 16dp pegado)."
      - "product_image (§017): tile sin marco — el usuario iteró recuadro blanco → crema → degradado mostaza-negro → mostaza sólido + borde → SIN recuadro ('las imagenes al tamaño que tienen'). Param aspectRatio para producción 16:9 (default 1). PNGs re-trimados al sujeto — el canvas cuadrado con margen vacío encogía al sujeto ~40% (causa raíz del 'se ven chiquitas')."
      - "promo_banner (§017): carrusel PageView infinito (initialPage~2500) con auto-avance 4s + Timer que cede tras swipe manual + dots solo si >1. Slide = straddle_card surfaceContainerHigh (tono hero, decisión del usuario) + cinta diagonal mostaza PROMO (variante 2 de una galería de 4 presentada al usuario) + countdown 'Termina en X' + chevron. Mock de los 5 tipos de oferta (2×1, gratis con compra, %OFF, envío gratis, combo fijo)."
