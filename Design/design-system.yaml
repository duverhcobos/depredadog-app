# Design System — Depredadog
# Convención: ver .devin/skills/design-system-docs
# Cada cambio visual → bump de version + spec actualizado + entrada en changelog.

meta:
  product: Depredadog
  version: 1.14.0
  updated: 2026-11-02

palette:
  # Identidad Depredadog — "condimentos" (definida por el usuario, §001):
  # ketchup / mostaza / pan / parrilla / pepinillo.
  # MVP: solo tema oscuro (decisión del usuario) — ThemeMode.dark fijo en
  # MaterialApp.router, ignora el tema del sistema. Los tokens *_light
  # quedan documentados y en AppColors/AppTheme.light() sin usarse, por si
  # se reactiva el soporte claro más adelante.
  primary_light: "#D62828"
  secondary_light: "#FBBF24"
  tertiary_light: "#5B8C3A"
  surface_light: "#FFF3D6"
  scaffold_light: "#FFFFFF"
  on_surface_light: "#4A2511"
  error_light: "#B3261E"
  primary_dark: "#FDD019" # mostaza del logo — decisión del usuario tras comparar vs rojo pleno y rojo pálido
  secondary_dark: "#FCD34D"
  tertiary_dark: "#8FBF6A"
  surface_dark: "#241511"
  scaffold_dark: "#000000" # negro puro — decisión del usuario
  on_surface_dark: "#FFF3D6"
  error_dark: "#F2B8B5"
  on_brand_gradient: "#FFFFFF"

typography:
  scale: material3 # display/headline/title/body/label por defecto de M3
  login_headline: "headlineSmall w800, letterSpacing 1.2, color primary"

spacing:
  unit: 4
  tokens: {xs: 4, sm: 8, md: 16, lg: 24, xl: 32}

components:
  app_theme_mode:
    description: "MVP solo oscuro (decisión del usuario): MaterialApp.router con theme=AppTheme.dark(), darkTheme=AppTheme.dark(), themeMode=ThemeMode.dark fijo — ignora el brightness del sistema. AppTheme.light()/AppColors *Light no se eliminaron (quedan sin usar, reversible). Consecuencia en Android nativo: values/styles.xml unificado (LaunchTheme/NormalTheme parten de Theme.Black.NoTitleBar sin calificador -night) para que el splash nativo también sea negro fijo y no haya flash blanco→negro con el sistema en modo claro — se eliminaron values-night/ y drawable-night-v21/ por redundantes."
  app_backdrop:
    status: "ELIMINADO — degradado de plantilla; el splash Flutter pasó a scaffold liso + imagotipo real"
  app_brand_mark:
    status: "ELIMINADO — la flama Material provisional fue reemplazada por el imagotipo real"
  app_launcher_icon:
    description: "Ícono launcher FIJO (decisión del usuario tras probar el modo-dual): isotipo tintas blancas como VectorDrawable (drawable/ic_launcher_foreground.xml, desde isotipo_mascota_.svg) sobre plato #000000, igual en claro y oscuro. El modo-dual se descartó — launchers/Settings cachean el ícono sin el modo ('no cambia nada'). El margen ~18%/lado (arte ~64% del lienzo) vive en el <group> del vector (viewport 3200², scale 3.48573, translate 575/736) — replica el lienzo de isotipo_icono_*. Compartidos: monochrome=silueta vectorial (themed icons), playstore 512 en store_assets/ y ic_launcher.png/round legacy (API<26, raster desde isotipo_icono_blanco). Pendiente: set iOS."
  splash_native_icon:
    description: "Splash nativo SIN ÍCONO (decisión final del usuario) — @drawable/splash_icon_empty, un VectorDrawable 240dp transparente (sin arte visible), solo para suprimir el fallback de Android 12+ que autocompone el ícono del launcher cuando no se declara windowSplashScreenAnimatedIcon. Solo queda el plato liso. Motivo medido en perfil de píxeles: tanto el PNG isotipo_icono_* como el VectorDrawable 1:1 del SVG oficial dieron el mismo blur en el borde — la Splash Screen API rasteriza el ícono a un Icon/bitmap internamente antes de la animación de reveal, independiente del formato/tamaño de la fuente (cambiar android:width/height 288→240dp no movió ni un byte). El primer logo nítido que ve el usuario es el del splash Flutter (Image.asset, Skia puro). MVP solo oscuro: el plato ya no es \"por tema\" — siempre #000000 (ver app_theme_mode)."
  brand_kit:
    description: "Kit completo en Design/brand/: png/ por densidad (0.75x–4x), svg/ fuentes vectoriales, appicon-pack-mascota-color/ (pack previo, registro). Convención de nombres: _blanco = tinta blanca para fondos oscuros, _negro = tinta oscura para fondos claros, _mascota = full color, _mono_* = una tinta, isotipo_icono_* = isotipo con margen de compensación horneado (~64% del lienzo) — referencia de composición para el <group> de los VectorDrawable y fuente de los raster legacy/API<26. Los SVG isotipo_mascota_* son la fuente de los VectorDrawable de ícono/splash. Tagline oficial: 'HOT DOGS & MÁS'."
  brand_tagline:
    description: "Tagline oficial de la guía de marca: 'HOT DOGS & MÁS'."
  elevated_button_primary:
    description: "Ancho completo, alto 52, radius 14, fondo sólido primary + texto onPrimary w600 16px (override del tonal M3 — la marca pide el primario sólido). En dark: mostaza sólida con texto negro rico. Loading: spinner 22px strokeWidth 2.5 color onPrimary DENTRO del botón (reemplaza solo el texto, sin deshabilitar ni atenuar el fondo — decisión del usuario: el botón sigue mostaza y onPressed queda inerte; el cubit ignora re-entradas). Durante su petición, TODOS los demás controles interactivos de la pantalla se bloquean con IgnorePointer(ignoring: isInProgress) — apariencia intacta, nada se atenúa (el usuario rechazó el disabled visible; el disabled solo pinta cuando es el estado semántico propio del control, ej. cooldown de reenvío)."
  custom_text_field:
    description: "Campo de formulario con label externo arriba (labelLarge w600 onSurface), icono prefijo opcional, radius 14, fill surfaceContainerLowest, enabledBorder outlineVariant. Foco en onSurface 1.6px — el primario rojo se confundía con error (feedback usuario). Error en línea reservada con helperText ' ' para no re-fluir el formulario."
  google_sign_in_button:
    description: "OutlinedButton ancho completo alto 52 radius 14, logo G oficial (assets/images/google_g.png) + texto 'Continuar con Google' (clave compartida loginGoogleButton — recomendación oficial de Google para superficies sign-up+sign-in; antes 'Ingresar'). Usado en login + register paso 1 (§013) — al ser widget compartido, ocultarlo en prod cubre ambas superficies. INTEGRADO (§014): onPressed lanza el flujo nativo del SDK → idToken → POST /auth/google → sesión → /home; cancel del selector = silencio; errores → toasts mapeados (suspendido/sin conexión/demasiados intentos) o genérico 'No pudimos entrar con Google'. Sin client ID el SDK falla → genérico (decisión del usuario: sin gate). Fallback: onPressed null → toast 'Disponible próximamente'. Config de prod pendiente — ver pendientes/006."
  app_toast:
    description: "Feedback efímero ÚNICO canal: AppToast (lib/core/widgets/app_toast.dart) sobre fluttertoast — error (bg error / texto onError) o success (bg primary / texto onPrimary), gravity BOTTOM, LENGTH_LONG. Reemplaza el estándar SnackBar anterior por decisión del usuario — NUNCA ScaffoldMessenger.showSnackBar directo. Se dispara siempre desde BlocListener (un listener por efecto con su propio listenWhen — un solo listener con else-if encadenado produjo un toast falso de 'reenviado' en transiciones ajenas: bug detectado por revisor-ui)."
  verify_email_code_input:
    description: "OTP de 6 casillas 48×56, radius 14 (=radius del sistema), fill surfaceContainerLowest, borde 1px outline inactivo / 1.6px primary activa / 1.6px error en error, dígito titleLarge w600 onSurface. Implementación propia (pinput se descartó: v7 exige ancestro Material del paquete material_ui desacoplado, incompatible con el Scaffold clásico): un TextField INVISIBLE cubre la fila (Positioned.fill, texto transparente, showCursor off) y captura teclado/digitsOnly/max 6/autofillHints oneTimeCode — sus casillas son puro render AnimatedContainer. OJO técnico: el inputDecorationTheme global trae filled+bordes por estado — hay que anularlos explícito (filled:false + los 6 borders por estado en InputBorder.none) o pinta una barra encima de las casillas. Auto-submit al completar el 6to dígito; bloqueo por IgnorePointer en isInProgress (sin atenuar); borde 'activo' sigue al FocusNode vía ListenableBuilder; pegar habilitado (menú contextual — el formatter limita a 6). A11y: Semantics 'código de verificación, X de 6' en el grupo + casillas en ExcludeSemantics. Desde §011 el render vive en el widget genérico SixDigitCodeField (params: controller/focusNode/hasError/onChanged/onSubmitted/semanticsLabel/autofocus) — VerifyEmailFormFields solo lo rebinda a su cubit y /forgot-password lo usa con autofocus:false (el wizard nunca abre el teclado al cambiar de paso)."
  remember_row:
    description: "Fila bajo el campo contraseña: Checkbox 'Recuérdame' (compacto, tap en texto alterna) a la izquierda + link '¿Olvidaste tu contraseña?' (bodySmall primary w600) a la derecha. rememberMe decidirá en integración si el refresh token persiste entre sesiones."
  login_brand_header:
    description: "Imagotipo vertical 148px (Hero tag HeroTags.brandImagotipo, vuela desde el splash) + headline primary + subtítulo (bodyMedium onSurface 70%). Asset por tema: imagotipo_depredadog.png (=imagotipo_negro_*) en claro; imagotipo_depredadog_dark.png (=imagotipo__1*, trazos blancos + color) en oscuro — con MVP solo oscuro (app_theme_mode) siempre resuelve a la variante dark. Densidades 1.5x–4x."
  register_stepper:
    description: "Indicador de pasos de wizard (register §009, generalizado en §011): N círculos 32px + conectores 2px + labels ('Datos'/'Cuenta'/'Revisión' en register; 'Correo'/'Código'/'Clave' en forgot-password). Estados: actual=círculo lleno primary + número onPrimary + label w600; completado=círculo tenue con ✓ + conector lleno; pendiente=outline + conector tenue. SOLO visual — no navega al tocar (la navegación es flecha/Atrás/back). Implementación: desde §011 el render es el widget genérico WizardStepper (params: labels/currentStep/progressLabel) — N segmentos Expanded simétricos, cada uno = media línea + círculo + media línea, así los conectores tocan el borde del círculo sin aire (el OverflowBox inicial se descartó — reventaba con altura infinita en tests y emulador). RegisterStepper quedó como wrapper fino que lee RegisterCubit; /forgot-password lo usa con su propio BlocBuilder. Fijo fuera del SingleChildScrollView con 16px al título. A11y: liveRegion anuncia 'Paso X de N'; cada segmento expone label+estado (completado/actual/pendiente) y selected en el actual (claves registerStep* reutilizadas — mismo texto)."

screens:
  splash:
    route: "/"
    spec: "Scaffold liso (color por tema; MVP solo oscuro, ver app_theme_mode) + imagotipo centrado 220px en Hero(tag: HeroTags.brandImagotipo) — asset por tema: imagotipo_depredadog.png claro / _dark.png oscuro (mismos del login header). Navega a /login ~800ms DESPUÉS de que el imagotipo decodifica (precacheImage secuencial — el login hereda el ImageCache y el header pinta sin parpadeo; Future.wait se descartó porque pintaba y navegaba en el mismo frame). El Hero hace que el imagotipo vuele del centro (220px) al header del login (148px) en vez de que una pantalla reemplace a la otra en seco. Futuro: aquí vivirá el chequeo de sesión."
  login:
    route: "/login"
    spec: "Scaffold liso + scroll. LoginBrandHeader (imagotipo en el mismo Hero que el splash), campos email/password (CustomTextField con AutofillGroup, error por campo que se limpia al editar), remember_row, ElevatedButton 'Iniciar sesión' (loading: spinner DENTRO del botón, ver elevated_button_primary), divider 'o continúa con', GoogleSignInButton, fila '¿No tienes cuenta? Regístrate'. Submit vacío → errores + toast + foco al primer inválido. Durante la petición todo lo interactivo se bloquea por IgnorePointer sin atenuar (campos, ojo, checkbox, Google, links). Submit real contra /auth/login: éxito → /home, 403 correo-no-verificado → /verify-email. Links: 'Regístrate' push a /register; '¿Olvidaste tu contraseña?' (remember_row) push a /forgot-password desde §011 (reemplazó el toast 'Disponible próximamente') — ambas salidas cierran autofill shouldSave:false para que el modal '¿Guardar contraseña?' no compita. Google INTEGRADO (§014): éxito → /home con finishAutofillContext(shouldSave:!isGoogleAuth — no guarda credenciales tipeadas nunca enviadas); errores → toast específico (suspendido/conexión/intentos) o genérico Google."
  verify_email:
    route: "/verify-email"
    spec: "Se llega desde login cuando el backend responde 'correo no verificado' (o con email en extra). Scaffold liso + PopScope(canPop:false → _backToLogin): la flecha top-left FIJA (fuera del bloque centrado — antes flotaba dentro de la Column centrada, bug detectado) y el back nativo de Android ambos van a /login porque se llega con go() y no hay stack que pop. Contenido centrado+scroll: ícono de marca icono_verificar_correo.svg (80px, flutter_svg, elemento firma — ExcludeSemantics, el headline ya describe), headline primary + subtítulo con el email destino, casillas OTP (componente verify_email_code_input), CTA 'Verificar' (loading: spinner DENTRO del botón, ver elevated_button_primary; campo y reenviar se bloquean por IgnorePointer en isInProgress), fila '¿No recibiste el código? Reenviar' con cooldown real 60s ('Reenviar en Ns', TextButton deshabilitado — el disabled visible del cooldown sí pinta: es su estado semántico, no un bloqueo de loading). Feedback por AppToast: error genérico 'Ingresa el código de 6 dígitos' (cubre vacío/parcial), 'Código reenviado', 'Verificación simulada'. resend() limpia código+error (el código viejo queda invalidado) y el TextField oculto se resincroniza por listener. INTEGRADO (§006): submit contra /auth/verify-email (éxito → sesión persistida → /home; código errado → casillas rojas + toast) y reenvío contra /auth/resend-verification."
  register:
    route: "/register"
    spec: "Wizard de 3 pasos (§008 + §009 — aprobado por el usuario: el formulario único de 8 inputs era denso). Header compacto SIN imagotipo (decisión del usuario): flecha top-left + register_stepper fijo + headline primary por paso ('Cuéntanos quién eres' / 'Tu correo y tu contraseña' / 'Todo listo, {firstName}') + subtítulo. Paso 1 'Datos': 4 campos LatAm (primer nombre*, segundo nombre, primer apellido*, segundo apellido) + teléfono opcional; sanitización compartida — solo letras latinas con tilde/ñ/ü + espacio + apóstrofe (' y ’), SIN guion (decisión del usuario), filtro al teclear + validación. Teléfono: solo dígitos máx 10, celular colombiano ^3\\d{9}$ (decisión: solo celular, solo dígitos). Paso 2 'Cuenta': email + contraseña (hint interior 'Ej: HotDog2024' — misma clave del login — + helper 'Mínimo 8 caracteres' bajo el campo) + confirmar (hint 'Repite tu contraseña') con ojos de visibilidad independientes. Paso 3 'Revisión': tarjeta Nombre compuesto/Correo/Teléfono o 'Sin teléfono' — la contraseña nunca se muestra. Navegación (modelo del usuario): flecha top-left SIEMPRE sale a /login (abandonar, no retrocede pasos); TextButton 'Atrás' a la izquierda del primario (solo pasos 2-3) retrocede un paso conservando lo tipeado; back nativo Android retrocede paso (paso 1 sale). Transición AnimatedSwitcher ~250ms + AnimatedSize; scroll reset por paso; contenido top-aligned. Teclado NUNCA abre solo al cambiar de paso (decisión del usuario tras probarlo) — solo al tocar campo o cuando 'Continuar' falla (foco al primer inválido del paso, no navega a otro paso). Validación por paso; submit revalida todo. Errores de campo GENÉRICOS (decisión del usuario): 'Teléfono/Correo/Nombre/Apellido incorrecto' — no revelan la regla. EXCEPCIÓN contraseña corta: el error ES la regla 'Mínimo 8 caracteres' — el helperText se reemplaza por errorText al fallar y 'Contraseña incorrecta' no le decía al usuario qué corregir (decisión del usuario tras verla en pantalla); la misma clave sirve de helper y error. Footer persistente '¿Ya tienes cuenta? Inicia sesión' (hit area ≥44dp + Semantics button). Durante submit: IgnorePointer en todo lo interactivo + guard isInProgress en el cubit. INTEGRADO §010: POST /auth/register real — éxito → /verify-email con email en extra y shouldSave:false; 409 correo-duplicado devuelve al paso 2 con 'Este correo ya tiene cuenta' (emailTaken prima sobre formato). Paso 1 lleva además bloque social Google (§013): tras el primario — divider 'o continúa con' + GoogleSignInButton dentro de AnimatedSize 250ms easeOut topCenter (sin él el footer saltaba ~116px en seco al cambiar de paso) + IgnorePointer(isInProgress); 32px de botón a footer (paridad login, no 24); en pasos 2-3 no existe (SizedBox.shrink — Google reemplaza el registro entero, no lo complementa). La G oficial es el ÚNICO Image de los pasos — la aserción 'sin imagotipo' de los tests apunta específicamente a ella."
  forgot_password:
    route: "/forgot-password"
    spec: "Wizard de 3 pasos (§011 — mismo shell que /register): flecha top-left + WizardStepper fijo con labels 'Correo'/'Código'/'Clave' + headline primary por paso + subtítulo. Paso 1 '¿Olvidaste tu contraseña?': solo correo (primario 'Enviar código'). Paso 2 'Revisa tu correo': subtítulo con el email tipeado (misma frase de verify) + SixDigitCodeField SIN autofocus (el wizard nunca abre teclado al cambiar de paso) + fila '¿No recibiste el código? Reenviar' con cooldown 60s ('Reenviar en Ns', TextButton disabled = estado semántico) — primario 'Verificar'. Paso 3 'Crea tu nueva contraseña': 'Nueva contraseña *' con ojo + hint interior 'Ej: HotDog2024' (clave compartida del login — sin él el campo se veía como caja muerta junto al confirm, detectado por el usuario) + helper 'Mínimo 8 caracteres' + 'Confirmar contraseña *' con hint 'Repite tu contraseña' + ojo independiente — primario 'Cambiar contraseña'. Navegación idéntica a register: flecha SIEMPRE abandona a /login (cualquier paso, pop si quedó apilada); 'Atrás' (pasos 2-3) retrocede paso conservando lo tipeado; back nativo retrocede paso (paso 1 sale). Transición AnimatedSwitcher ~250ms + AnimatedSize; scroll reset; foco al primer inválido del paso al fallar. Errores genéricos reutilizando claves: 'Correo incorrecto' / 'Las contraseñas no coinciden' / toast de código 'Ingresa el código de 6 dígitos' (verifyEmailFormInvalid compartida) — EXCEPCIÓN contraseña corta: el error es la regla misma 'Mínimo 8 caracteres' (el helper se reemplaza por errorText y 'Contraseña incorrecta' no decía qué estaba mal — decisión del usuario). Footer compartido '¿Ya tienes cuenta? Inicia sesión' (RegisterLoginFooter con isInProgress||isResending por parámetro). Loading: spinner DENTRO del primario + IgnorePointer/inerter — cubre también isResending ('Verificar', flecha, footer y codeChanged esperan al reenvío, misma carrera que verify; el listener de resync también escucha isResending para barrer dígitos fantasma del IME). PROVISIONAL: envío de código, check OTP y reset simulados (nextStep valida y avanza; submit delay 800ms → AuthSession.markAuthenticated con User stub 'forgot-preview' → success → /home con shouldSave:true — espejo del auto-login real: sin la sesión stub el guard rebota /home→/login en silencio; la stub solo vive en RAM, muere al reiniciar la app. La integración llega con forgot-password/check-reset-code/reset-password). Auto-avanza al 6to dígito igual que verify; resend() limpia código+error y resincroniza el TextField oculto."
  welcome:
    status: "ELIMINADA (decisión del usuario) — splash va directo a /login para no autenticados"

changelog:
  - version: "1.14.0"
    date: 2026-11-02
    page: "login + register + google_sign_in_button"
    status: "completed"
    changes:
      - "Google sign-in INTEGRADO (§014): GoogleSignInButton.onPressed cableado al cubit en login y register paso 1 — flujo nativo del SDK (selector de cuentas + consentimiento OAuth) → idToken → POST /auth/google → sesión completa → /home directo."
      - "Comportamientos decididos por el usuario: cancel del selector = silencio (sin error); errores → toasts mapeados (suspendido / sin conexión / demasiados intentos) o genérico 'No pudimos entrar con Google — inténtalo de nuevo'; sin gate de client ID — sin GOOGLE_SERVER_CLIENT_ID el SDK falla y se ve el genérico."
      - "Detalle auth: éxito Google NO guarda autofill de credenciales tipeadas nunca enviadas (shouldSave: !isGoogleAuth en login — el cubit marca el flujo para distinguir el 401 de Google del de correo; register ya usaba shouldSave:false en todo éxito)."
      - "Verificado en vivo contra backend + Google Cloud reales (proyecto Depredadog, consent External + test user, clientes Android debug + Web): selector → consentimiento → /home; cold restart restaura sesión vía /auth/me. Config de prod (SHA-1 release, publicar consent screen) sigue en pendientes/006."
      - "Spec verify-email corregida: decía 'simulado' pero está integrada desde §006."
  - version: "1.13.0"
    date: 2026-11-02
    page: "register + google_sign_in_button"
    status: "completed"
    changes:
      - "Bloque Google sign-in en /register paso 1 (§013, decisión del usuario): tras el primario — divider 'o continúa con' + GoogleSignInButton compartido, espejo del bloque de login; en pasos 2-3 no existe (Google reemplaza el registro entero, no lo complementa)."
      - "Copy del botón compartido: 'Ingresar con Google' → 'Continuar con Google' (recomendación oficial de Google para superficies sign-up+sign-in — la clave loginGoogleButton cambia en login y register a la vez)."
      - "Detalles revisor-ui aplicados: 32px de botón a footer (paridad literal con login, antes 24) + AnimatedSize 250ms easeOut topCenter envolviendo el bloque — sin él el footer saltaba ~116px en seco durante la transición de paso."
      - "PROVISIONAL: el botón sigue mostrando toast 'Disponible próximamente' — /auth/google sin integrar (pendiente 006 — ahora cubre las 2 superficies al ser widget compartido)."
  - version: "1.12.1"
    date: 2026-10-31
    page: "forgot_password + register"
    status: "completed"
    changes:
      - "Copy: metáfora 'llave' eliminada por claridad (decisión del usuario) — forgot '¿Olvidaste tu contraseña?'/'Crea tu nueva contraseña' y register paso 2 'Tu correo y tu contraseña'."
      - "Error de contraseña corta: 'Contraseña incorrecta' → 'Mínimo 8 caracteres' (el error ES la regla — excepción documentada a los errores genéricos; la misma clave sirve de helper y error para que nunca desaparezca en el fallo 'tooShort')."
      - "Hint interior 'Ej: HotDog2024' (loginPasswordHint compartida) agregado al campo contraseña de register paso 2 y forgot paso 3 — el campo sin placeholder se veía como caja muerta junto al confirm (detectado por el usuario)."
  - version: "1.12.0"
    date: 2026-10-31
    page: "forgot_password + wizard_stepper + verify_email_code_input"
    status: "completed"
    changes:
      - "Nueva pantalla forgot_password (presentación, §011): wizard de 3 pasos Correo → Código OTP → Nueva clave, mismo shell que /register (stepper fijo, AnimatedSwitcher+AnimatedSize, 'Atrás' secundario, back nativo por paso, flecha siempre a /login, scroll reset, sin autofocus por paso). Se alcanza por push desde el link de login (reemplazó el toast 'Disponible próximamente')."
      - "Extracciones sin cambio visual (reutilización §011): register_stepper → WizardStepper genérico (labels/currentStep/progressLabel; RegisterStepper quedó wrapper de su cubit); verify_email_code_input → SixDigitCodeField genérico (controller/focusNode/hasError/onChanged/onSubmitted/semanticsLabel/autofocus; VerifyEmailFormFields lo rebinda — verify queda idéntico); RegisterField → FormBlocField<B,S> genérico (RegisterField subclase fina); RegisterLoginFooter desacoplado de RegisterCubit (isInProgress por parámetro — lo comparten los dos wizards)."
      - "CodeInput (6 dígitos) se movió de verify_email_inputs.dart a inputs/code_input.dart compartido; forgot_inputs.dart no hizo falta."
      - "Reenvío del paso 2: cooldown 60s simulado con Timer local idéntico a verify (resend limpia código+error y resincroniza el campo oculto); 'Verificar'/flecha/codeChanged se bloquean durante isResending — misma carrera documentada en verify."
      - "Submit del paso 3 simulado 800ms → /home con finishAutofillContext(shouldSave:true) — distinto de register (false) porque acá el flujo real termina en auto-login y el gestor debe ofrecer la NUEVA contraseña."
      - "l10n: 12 claves forgot* nuevas; reutilizadas sin duplicar verifyEmailSubtitle/Resend*/Button/CodeSemantics, registerStep*, registerConfirm*/PasswordHint/EmailLabel/BackStep/HasAccount/LoginLink, loginEmailRequired/EmailHint/FormInvalid/Show|HidePassword, registerEmailInvalid/PasswordRequired|Invalid/ConfirmRequired|Mismatch."
      - "Tests: forgot_password_cubit_test (validación por paso, flags, resend+cooldown, guard edición en submit, submit simulado, CodeInput) + forgot_password_screen_test (render por paso, stepper, flecha/link → /login, 'Atrás', back nativo, email en subtítulo paso 2, éxito → /home)."
  - version: "1.11.0"
    date: 2026-10-30
    page: "register + register_stepper + login (footer)"
    status: "completed"
    changes:
      - "Nueva pantalla register (presentación, §008 + §009): wizard de 3 pasos — el formulario único de 8 inputs se sentía denso ('muchos inputs en una sola pantalla', feedback del usuario). Paso 1 Datos (nombres LatAm + teléfono), paso 2 Cuenta (email + claves), paso 3 Revisión (decisión: paso libre elegido como review). Sin imagotipo en el wizard (decisión del usuario)."
