# Design System — Depredadog
# Convención: ver .devin/skills/design-system-docs
# Cada cambio visual → bump de version + spec actualizado + entrada en changelog.

meta:
  product: Depredadog
  version: 1.29.0
  updated: 2026-11-06

palette:
  # Identidad Depredadog — "condimentos" (definida por el usuario, §001):
  # ketchup / mostaza / pan / parrilla / pepinillo.
  # MVP: solo tema oscuro (decisión del usuario) — ThemeMode.dark fijo en
  # MaterialApp.router, ignora el tema del sistema. Los tokens *_light
  # quedan documentados y en AppColors/AppTheme.light() sin usarse, por si
  # se reactiva el soporte claro más adelante.
  primary_light: "#D62828"
  secondary_light: "#FBBF24"
  tertiary_light: "#5B8C3A"
  surface_light: "#FFF3D6"
  scaffold_light: "#FFFFFF"
  on_surface_light: "#4A2511"
  error_light: "#B3261E"
  primary_dark: "#FDD019" # mostaza del logo — decisión del usuario tras comparar vs rojo pleno y rojo pálido
  secondary_dark: "#FCD34D"
  tertiary_dark: "#8FBF6A"
  surface_dark: "#241511"
  scaffold_dark: "#000000" # negro puro — decisión del usuario
  on_surface_dark: "#FFF3D6"
  error_dark: "#F2B8B5"
  on_brand_gradient: "#FFFFFF"

typography:
  scale: material3 # display/headline/title/body/label por defecto de M3
  login_headline: "headlineSmall w800, letterSpacing 1.2, color primary"

spacing:
  unit: 4
  tokens: {xs: 4, sm: 8, md: 16, lg: 24, xl: 32}

components:
  app_theme_mode:
    description: "MVP solo oscuro (decisión del usuario): MaterialApp.router con theme=AppTheme.dark(), darkTheme=AppTheme.dark(), themeMode=ThemeMode.dark fijo — ignora el brightness del sistema. AppTheme.light()/AppColors *Light no se eliminaron (quedan sin usar, reversible). Consecuencia en Android nativo: values/styles.xml unificado (LaunchTheme/NormalTheme parten de Theme.Black.NoTitleBar sin calificador -night) para que el splash nativo también sea negro fijo y no haya flash blanco→negro con el sistema en modo claro — se eliminaron values-night/ y drawable-night-v21/ por redundantes."
  app_backdrop:
    status: "ELIMINADO — degradado de plantilla; el splash Flutter pasó a scaffold liso + imagotipo real"
  app_brand_mark:
    status: "ELIMINADO — la flama Material provisional fue reemplazada por el imagotipo real"
  app_launcher_icon:
    description: "Ícono launcher FIJO (decisión del usuario tras probar el modo-dual): isotipo tintas blancas como VectorDrawable (drawable/ic_launcher_foreground.xml, desde isotipo_mascota_.svg) sobre plato #000000, igual en claro y oscuro. El modo-dual se descartó — launchers/Settings cachean el ícono sin el modo ('no cambia nada'). El margen ~18%/lado (arte ~64% del lienzo) vive en el <group> del vector (viewport 3200², scale 3.48573, translate 575/736) — replica el lienzo de isotipo_icono_*. Compartidos: monochrome=silueta vectorial (themed icons), playstore 512 en store_assets/ y ic_launcher.png/round legacy (API<26, raster desde isotipo_icono_blanco). Pendiente: set iOS."
  splash_native_icon:
    description: "Splash nativo SIN ÍCONO (decisión final del usuario) — @drawable/splash_icon_empty, un VectorDrawable 240dp transparente (sin arte visible), solo para suprimir el fallback de Android 12+ que autocompone el ícono del launcher cuando no se declara windowSplashScreenAnimatedIcon. Solo queda el plato liso. Motivo medido en perfil de píxeles: tanto el PNG isotipo_icono_* como el VectorDrawable 1:1 del SVG oficial dieron el mismo blur en el borde — la Splash Screen API rasteriza el ícono a un Icon/bitmap internamente antes de la animación de reveal, independiente del formato/tamaño de la fuente (cambiar android:width/height 288→240dp no movió ni un byte). El primer logo nítido que ve el usuario es el del splash Flutter (Image.asset, Skia puro). MVP solo oscuro: el plato ya no es \"por tema\" — siempre #000000 (ver app_theme_mode)."
  brand_kit:
    description: "Kit completo en Design/brand/: png/ por densidad (0.75x–4x), svg/ fuentes vectoriales, appicon-pack-mascota-color/ (pack previo, registro). Convención de nombres: _blanco = tinta blanca para fondos oscuros, _negro = tinta oscura para fondos claros, _mascota = full color, _mono_* = una tinta, isotipo_icono_* = isotipo con margen de compensación horneado (~64% del lienzo) — referencia de composición para el <group> de los VectorDrawable y fuente de los raster legacy/API<26. Los SVG isotipo_mascota_* son la fuente de los VectorDrawable de ícono/splash. Tagline oficial: 'HOT DOGS & MÁS'."
  brand_tagline:
    description: "Tagline oficial de la guía de marca: 'HOT DOGS & MÁS'."
  elevated_button_primary:
    description: "Ancho completo, alto 52, radius 14, fondo sólido primary + texto onPrimary w600 16px (override del tonal M3 — la marca pide el primario sólido). En dark: mostaza sólida con texto negro rico. Loading: spinner 22px strokeWidth 2.5 color onPrimary DENTRO del botón (reemplaza solo el texto, sin deshabilitar ni atenuar el fondo — decisión del usuario: el botón sigue mostaza y onPressed queda inerte; el cubit ignora re-entradas). Durante su petición, TODOS los demás controles interactivos de la pantalla se bloquean con IgnorePointer(ignoring: isInProgress) — apariencia intacta, nada se atenúa (el usuario rechazó el disabled visible; el disabled solo pinta cuando es el estado semántico propio del control, ej. cooldown de reenvío)."
  custom_text_field:
    description: "Campo de formulario con label externo arriba (labelLarge w600 onSurface), icono prefijo opcional, radius 14, fill surfaceContainerLowest, enabledBorder outlineVariant. Foco en onSurface 1.6px — el primario rojo se confundía con error (feedback usuario). Error en línea reservada con helperText ' ' para no re-fluir el formulario."
  google_sign_in_button:
    description: "OutlinedButton ancho completo alto 52 radius 14, logo G oficial (assets/images/google_g.png) + texto 'Continuar con Google' (clave compartida loginGoogleButton — recomendación oficial de Google para superficies sign-up+sign-in; antes 'Ingresar'). Usado en login + register paso 1 (§013) — al ser widget compartido, ocultarlo en prod cubre ambas superficies. INTEGRADO (§014): onPressed lanza el flujo nativo del SDK → idToken → POST /auth/google → sesión → /home; cancel del selector = silencio; errores → toasts mapeados (suspendido/sin conexión/demasiados intentos) o genérico 'No pudimos entrar con Google'. Sin client ID el SDK falla → genérico (decisión del usuario: sin gate). Fallback: onPressed null → toast 'Disponible próximamente'. Config de prod pendiente — ver pendientes/006."
  app_toast:
    description: "Feedback efímero ÚNICO canal: AppToast (lib/core/widgets/app_toast.dart) sobre fluttertoast — error (bg error / texto onError), success (bg primary / texto onPrimary) o info (bg surfaceContainerHighest / texto onSurface — §016, neutra tipo 'Disponible próximamente'), gravity BOTTOM, LENGTH_LONG. Reemplaza el estándar SnackBar anterior por decisión del usuario — NUNCA ScaffoldMessenger.showSnackBar directo. Se dispara siempre desde BlocListener (un listener por efecto con su propio listenWhen — un solo listener con else-if encadenado produjo un toast falso de 'reenviado' en transiciones ajenas: bug detectado por revisor-ui). El plugin nativo no dibuja ícono: AppToast.info acepta icon: opcional para una futura migración a toast custom."
  app_shell:
    description: "Marco persistente del área autenticada (§016): StatefulShellRoute.indexedStack con 3 branches (/home, /orders, /profile — constantes en AuthGuard, hijas NUNCA rutas raíz). Estructura AppShellLayout = Column[ShellHeader + Divider 1px outlineVariant + Expanded(shell)] + NavigationBar M3. Header 64dp: margen 16px, imagotipo_horizontal_blanco.png 40px (variante HORIZONTAL del brand kit — el vertical dejaba el tagline ilegible en banda; decisión del usuario), Spacer, store_status_chip (§017 — píldora '● Abierto' mock, ver componente) + IconButton campana notifications_outlined + IconButton carrito shopping_cart_outlined con Badge REAL (§020 — unidades Σ quantity del CartCubit via context.select, isLabelVisible count>0, cap visual '99+'; backgroundColor primary / textColor onPrimary — el default M3 pintaba rosa-error ajeno a la marca, hallazgo revisor-ui) que navega con PUSH a AuthGuard.cartRoute (preserva el stack: volver del carrito regresa al detalle con la personalización intacta — go() la destruía, revisor-ui §020) y se DESHABILITA estando ya en el carrito (GoRouterState.uri == cartRoute → onPressed null + Semantics enabled:false — un push sobre sí misma apilaba la pantalla y el back mentía, re-crítica §020). A11y resuelto: Semantics combinado 'Carrito, N ítems' (cartBadgeA11y) envuelve el botón + ExcludeSemantics en el label del badge. La campana sigue PROVISIONAL → AppToast.info 'Disponible próximamente' hasta que exista el módulo notificaciones. NavigationBar default M3 (~80dp + insets — sin height explícito): destinations Inicio home_outlined→home_rounded, Pedidos receipt_long_outlined→receipt_long_rounded, Perfil person_outline_rounded→person_rounded; indicador pill secondaryContainer; goBranch entre secciones (NUNCA push — no mueve currentIndex) y re-tap del tab activo = initialLocation:true (vuelve a la raíz de la sección). Back nativo (decisión del usuario): PopScope(canPop: currentIndex==0) — fuera de Inicio goBranch(0) a Inicio; en Inicio sale de la app. Tooltips localizados (shellNotificationsTooltip/shellCartTooltip), imagotipo con semanticLabel appName."
  module_placeholder:
    description: "Destino provisional de cada branch del shell (§016) mientras su módulo real no existe. Patrón pantalla de estado del estándar: Icon 80px primary (el ícono selected de su sección: home_rounded / receipt_long_rounded / person_rounded) + nombre del módulo titleMedium + 'Disponible próximamente' bodyMedium onSurface α0.7, centrado. Params: icon, moduleLabel (localizado). Reemplazó al texto plano 'X — Disponible próximamente' (sin jerarquía y duplicaba el label del tab activo — hallazgo revisor-ui)."
  verify_email_code_input:
    description: "OTP de 6 casillas 48×56, radius 14 (=radius del sistema), fill surfaceContainerLowest, borde 1px outline inactivo / 1.6px primary activa / 1.6px error en error, dígito titleLarge w600 onSurface. Implementación propia (pinput se descartó: v7 exige ancestro Material del paquete material_ui desacoplado, incompatible con el Scaffold clásico): un TextField INVISIBLE cubre la fila (Positioned.fill, texto transparente, showCursor off) y captura teclado/digitsOnly/max 6/autofillHints oneTimeCode — sus casillas son puro render AnimatedContainer. OJO técnico: el inputDecorationTheme global trae filled+bordes por estado — hay que anularlos explícito (filled:false + los 6 borders por estado en InputBorder.none) o pinta una barra encima de las casillas. Auto-submit al completar el 6to dígito; bloqueo por IgnorePointer en isInProgress (sin atenuar); borde 'activo' sigue al FocusNode vía ListenableBuilder; pegar habilitado (menú contextual — el formatter limita a 6). A11y: Semantics 'código de verificación, X de 6' en el grupo + casillas en ExcludeSemantics. Desde §011 el render vive en el widget genérico SixDigitCodeField (params: controller/focusNode/hasError/onChanged/onSubmitted/semanticsLabel/autofocus) — VerifyEmailFormFields solo lo rebinda a su cubit y /forgot-password lo usa con autofocus:false (el wizard nunca abre el teclado al cambiar de paso)."
  remember_row:
    description: "Fila bajo el campo contraseña: Checkbox 'Recuérdame' (compacto, tap en texto alterna) a la izquierda + link '¿Olvidaste tu contraseña?' (bodySmall primary w600) a la derecha. rememberMe decidirá en integración si el refresh token persiste entre sesiones."
  login_brand_header:
    description: "Imagotipo vertical 148px (Hero tag HeroTags.brandImagotipo, vuela desde el splash) + headline primary + subtítulo (bodyMedium onSurface 70%). Asset por tema: imagotipo_depredadog.png (=imagotipo_negro_*) en claro; imagotipo_depredadog_dark.png (=imagotipo__1*, trazos blancos + color) en oscuro — con MVP solo oscuro (app_theme_mode) siempre resuelve a la variante dark. Densidades 1.5x–4x."
  register_stepper:
    description: "Indicador de pasos de wizard (register §009, generalizado en §011): N círculos 32px + conectores 2px + labels ('Datos'/'Cuenta'/'Revisión' en register; 'Correo'/'Código'/'Clave' en forgot-password). Estados: actual=círculo lleno primary + número onPrimary + label w600; completado=círculo tenue con ✓ + conector lleno; pendiente=outline + conector tenue. SOLO visual — no navega al tocar (la navegación es flecha/Atrás/back). Implementación: desde §011 el render es el widget genérico WizardStepper (params: labels/currentStep/progressLabel) — N segmentos Expanded simétricos, cada uno = media línea + círculo + media línea, así los conectores tocan el borde del círculo sin aire (el OverflowBox inicial se descartó — reventaba con altura infinita en tests y emulador). RegisterStepper quedó como wrapper fino que lee RegisterCubit; /forgot-password lo usa con su propio BlocBuilder. Fijo fuera del SingleChildScrollView con 16px al título. A11y: liveRegion anuncia 'Paso X de N'; cada segmento expone label+estado (completado/actual/pendiente) y selected en el actual (claves registerStep* reutilizadas — mismo texto)."
  signature_strip:
    description: "La firma visual del catálogo (§017, decisión iterada del usuario): franja vertical mostaza de ANCHO FIJO 40% de pantalla (kSignatureStripFraction = 0.4), alto completo, anclada a la izquierda — corre detrás de TODO el contenido scrolleable (Stack: [SignatureStrip, ListView]), no un elemento por sección. Constantes compartidas en signature_strip.dart: kCardStripInset = 0.5 (dónde arranca la card dentro de la franja — a 0.6 el conjunto quedaba con demasiado aire lateral, feedback del usuario), kFrameOverhang = 44 (cuánto sobresale la imagen del borde izquierdo de la card), kFrameTextGap = 14 (gap imagen→texto), blackZoneMargin(width) = width·0.4·0.5 − 44 (margen derecho SIMÉTRICO al sobrante izquierdo del marco — el conjunto card+imagen queda centrado en pantalla; antes la card llegaba al ras derecho y se sentía corrida). En pantallas SIN franja (ninguna hoy) no aplica."
  straddle_card:
    description: "La familia de cards del catálogo (§017): TODA card de home/lista/promo/vacío cruza el límite mostaza↔negro — nace dentro de la franja (left = strip·kCardStripInset) y termina con margen derecho blackZoneMargin (simétrico). Geometría: alto 116 (productos/categorías/promo; hero 144), radius estándar Card, color surfaceContainerLow (EXCEPCIÓN promo: surfaceContainerHigh — tono de la hero, decisión del usuario como 2ª diferenciación). Composición dentro de la card: imagen FLOTANTE a la izquierda a caballo del borde (ver product_image — el tile se posiciona cardLeft − size/2 + kFrameOverhang... en la práctica sale del borde ~50%: la mitad sobre mostaza, la mitad sobre la card) → texto anclado a kFrameTextGap del borde derecho de la imagen (antes existió un 'eje universal' = borde franja + 16dp — el usuario lo quitó: dejaba ~40dp de aire entre imagen y texto; ahora el texto 'abraza' la imagen caiga donde caiga sobre la superficie oscura de la card) → acceso derecho: chevron chevron_right 18dp primary con 16dp de padding (antes 16dp pegado al borde, feedback del usuario) en categorías/promo; botón circular '+' primary en productos; FilledButton '+ Agregar' compacto + precio primary en la hero. InkWell cubre la card entera (hit ≥48dp). Card fantasma (vacíos): misma cuna a caballo, sin contenido ni affordance, centrada en el viewport — el gesto de la firma persiste aunque la categoría no tenga productos."
  product_image:
    description: "Widget compartido de imagen de producto/categoría (§017): tile SIN marco ni fondo (el usuario probó recuadro blanco → crema → degradado → mostaza + borde y lo descartó: 'quitar el recuadro, las imágenes al tamaño actual') — la imagen flota sobre la franja/card. Tamaño = (cardHeight − 16) · 0.8 cuadrado; param aspectRatio (default 1) preparado para producción: los assets reales serán 16:9 y se pasará 16/9 (el tile se vuelve apaisado conservando la altura — revisar el gap texto al ensancharse). BoxFit.contain sobre PNG re-trimados al sujeto +5% (los canvas originales 1000×1000 con ~13% de margen vacío encogían al sujeto ~40% — re-trimados en assets/images/products/). IgnorePointer para que el tap pase a la card. INTEGRADO (§019): param opcional imageUrl — cuando el backend sirva fotos (product_images, hoy null) Image.network manda y el asset local por slug queda de fallback (errorBuilder); los callers resuelven el asset vía CatalogAssets.productAsset(slug)."
  sold_out_tag:
    description: "Tag de disponibilidad agotada (§019): píldora compacta errorContainer/onErrorContainer radius 8, texto 'Agotado' (catalogSoldOut) labelSmall w800 — reemplaza el affordance de la card en el mismo slot (en product_card ocupa el hit-area 48dp del círculo '+'; en hero_product_card el slot del FilledButton '+ Agregar'; en el detalle el CTA del footer es FilledButton con onPressed:null mostrando el mismo texto y en las OptionRow de adicionales el trailing '+$X' se sustituye por el texto). Regla §019 ajustada por el usuario: producto agotado efectivo (isSellable=false — isAvailable=false del dueño O un ingrediente INCLUIDO isEssential agotado, ej. salchicha/pan: sin ellos no hay perro) → tag + sin tap SIN atenuación (la Opacity 0.55 de card+imagen se descartó — 'con el botón Agotado basta'); opción isAvailable=false → fila/chip con enabled:false → tap inerte + Opacity 0.45 (aprobada) + ícono Icons.cancel_rounded error reemplazando el check/X (en SelectChip la X va antes del nombre, 14dp). REGLA DE CAMBIO GRATIS (decisión del usuario): ingrediente INCLUIDO agotado (RemovableRow enabled:false) muestra junto a la X un icono swap_horiz_rounded 20dp primary (IconButton 28dp, FUERA de la atenuación; semanticLabel=detailSwapCta) SOLO si la opción es isReplaceable — agotado NO reemplazable (salchicha/pan, corazón del producto) muestra la X sin ↔ — que se vuelve expand_less_rounded al desplegar — expande (AnimatedSize 180ms easeOutCubic, top-anchored, hardEdge) bajo la fila los adicionales disponibles E isReplacementEligible (lo que el dueño permite regalar — la salchicha doble nunca sale) como OptionRows indentados SIN etiqueta trailing (el usuario descartó la palabra 'Gratis' en toda la app — detailFreeTag eliminada); elegir UNO colapsa el picker de una y el reemplazo queda como FILA PROPIA bajo el agotado con colores de fila activa — sangrada 20dp + gancho subdirectory_arrow_right_rounded 16dp primary (↳, decisión del usuario: así se lee como hija del ingrediente agotado cuando hay varios), tocarla o el icono reabre el picker para cambiarla. Solo el ingrediente agotado habilita el cambio — 1:1 por ingrediente agotado. UNICIDAD DEL CANDIDATO (bug reportado por el usuario): un adicional ya tomado como reemplazo por OTRO agotado NO se lista en su picker — la exclusión es entre agotados, el propio sí se sigue listando; si para una agotada no queda ningún candidato libre el ↔ se oculta (nunca picker vacío)."
  catalog_states:
    description: "Estados compartidos de carga/error de las pantallas de catálogo (§019): CatalogLoadingView = CircularProgressIndicator primary centrado (primera carga sin datos). CatalogErrorView = patrón pantalla de estado: ícono wifi_off_rounded 40px onSurface α0.5 + título 'No pudimos cargar la carta' titleSmall w700 + subtítulo 'Revisa tu conexión e inténtalo de nuevo.' bodySmall α0.65 + FilledButton.tonalIcon 'Reintentar' (icono refresh 18px) — SOLO aparece cuando la primera carga falla sin caché que mostrar; el refresh silencioso con datos NUNCA cae acá (falla en silencio conservando el menú). El detalle suma una vista inline hermana para slug desconocido: restaurant_outlined + 'Este producto ya no está en la carta' + 'Volver al menú'."
  promo_banner:
    description: "Carrusel de promociones activas (§017): slot fijo arriba del listado con PageView.builder INFINITO (initialPage = len·500 ≈ 2500 — loop seamless en ambas direcciones, también manual hacia atrás) + Timer de auto-avance cada 4s que se reinicia tras cualquier cambio de página (si el usuario desliza, espera otros 4s). Dots indicadores centrados bajo la card (activo=primary, solo si hay >1 promo). El slide es una straddle_card de surfaceContainerHigh (tono elevado de la hero — decisión del usuario) + CINTA diagonal mostaza 'PROMO' en la esquina superior derecha (variante escogida de una galería de 4: invertida / bandera / badge / invertida+badge — el usuario eligió la bandera) + título titleSmall + countdown 'Termina en {Xh Ym|Xd Yh}' bodySmall atenuado con icono schedule (decisión: contador real, no 'solo hoy') + chevron 18dp. Tipos de oferta cubiertos por el mock (5): 2×1/BOGO, item gratis con compra, % OFF en la carta, envío gratis, combo a precio fijo. Integración: endsIn se computará del endsAt real del módulo promotions con refresh por minuto."
  store_status_chip:
    description: "Píldora compacta del estado del negocio (§017): dot 8dp (verde abierto / rojo cerrado) + label 'Abierto'/'Cerrado' bodySmall w600 — vive en el ShellHeader entre el imagotipo y la campana (decisión del usuario: estaba como franja propia en home; se movió al header para ser visible en las 3 tabs) y el aire que ocupaba (~36dp) quedó como primer item del ListView para que el carrusel respire bajo el header. Mock isOpen:true — sin ETA ('Entrega en 30-45 min' quedó fuera del header por espacio; si vuelve será en contexto checkout/tracking)."
  scrolling_title:
    description: "Patrón de encabezado de pantallas hijas del catálogo (§017/§018 — decisión del usuario): el título Anton mostaza 'naciente' va DENTRO del ListView como primer ítem (sale de pantalla al bajar, reaparece al subir) — NO es un header fijo. La caja del texto entra apenas al mostaza (Align centerRight + FractionallySizedBox widthFactor 0.602 right + Text alineado a la izquierda: el filo de la 1ª letra se funde con la franja → 'nace' del mostaza; punto calibrado a mano por el usuario). La flecha back NEGRA (onPrimary) es lo único FIJO: Positioned top:12/left:4 del Stack, sobre la franja — navegación persistente mientras todo lo demás fluye. Aplica hoy en category_products y product_detail."
  customization_section:
    description: "Card de sección de personalización del detalle (§018): straddle_card estándar con título de sección Anton mostaza (titleSmall) + tag opcional a la derecha (píldora secondaryContainer — sin uso actual tras eliminar 'Gratis') + hairline divisor + contenido. Variantes de fila: RemovableRow (ingrediente propio — check circular primary tacha el nombre con strikeThrough al quitarlo), OptionRow (adicional pago — nombre + '+$X.XXX' primary + radio vacío→check primary al seleccionar), SelectChip (topping/salsa gratis — píldora outline→rellena primary con texto onPrimary al activarse, en ChipWrap fluido). El grupo entero scrollea con la pantalla."
  cart_edit_scope_sheet:
    description: "Bottom sheet '¿A cuántos aplicar los cambios?' (§021 — decisión del usuario: pregunta AL GUARDAR la edición de una fila con quantity>1; copy con referente, revisor-ui): showModalBottomSheet<bool> surfaceContainerLow con radius superior 16, título titleSmall w700 PRIMARY (mostaza — la única pregunta que no cantaba, pulido estético) + 2 ListTiles — 'Solo 1' (looks_one_rounded → pop false: separa una unidad con la nueva config, la original queda qty−1 y la editada se inserta ADYACENTE a su origen) y 'Las {count}' (format_list_numbered_rounded → pop true: cambia la fila entera); null = cancelado (no se guarda nada). Solo lo invoca el modo edición del detalle."
  segmented_toggle:
    description: "Toggle segmentado de 2 opciones del checkout (§022): track Container 48dp surfaceContainerHighest radius 24 con padding 4 (píldoras de 40dp de hit area — mínimo interactivo, revisor-ui), dentro Row de 2 píldoras Expanded simétricas — la activa es AnimatedContainer 150ms radius 20 con fill primary + texto onPrimary w700; la inactiva transparente con texto onSurface α0.7 w500. InkWell StadiumBorder por píldora + Semantics(selected, inMutuallyExclusiveGroup) para TalkBack. Misma decisión visual que el SelectChip lleno (activo = mostaza sólida), aplicada a selección excluyente grande. Usado hoy solo para Recoger/Domicilio."

screens:
  splash:
    route: "/"
    spec: "Scaffold liso (color por tema; MVP solo oscuro, ver app_theme_mode) + imagotipo centrado 220px en Hero(tag: HeroTags.brandImagotipo) — asset por tema: imagotipo_depredadog.png claro / _dark.png oscuro (mismos del login header). Navega a /login ~800ms DESPUÉS de que el imagotipo decodifica (precacheImage secuencial — el login hereda el ImageCache y el header pinta sin parpadeo; Future.wait se descartó porque pintaba y navegaba en el mismo frame). El Hero hace que el imagotipo vuele del centro (220px) al header del login (148px) en vez de que una pantalla reemplace a la otra en seco. Futuro: aquí vivirá el chequeo de sesión."
  login:
    route: "/login"
    spec: "Scaffold liso + scroll. LoginBrandHeader (imagotipo en el mismo Hero que el splash), campos email/password (CustomTextField con AutofillGroup, error por campo que se limpia al editar), remember_row, ElevatedButton 'Iniciar sesión' (loading: spinner DENTRO del botón, ver elevated_button_primary), divider 'o continúa con', GoogleSignInButton, fila '¿No tienes cuenta? Regístrate'. Submit vacío → errores + toast + foco al primer inválido. Durante la petición todo lo interactivo se bloquea por IgnorePointer sin atenuar (campos, ojo, checkbox, Google, links). Submit real contra /auth/login: éxito → /home, 403 correo-no-verificado → /verify-email. Links: 'Regístrate' push a /register; '¿Olvidaste tu contraseña?' (remember_row) push a /forgot-password desde §011 (reemplazó el toast 'Disponible próximamente') — ambas salidas cierran autofill shouldSave:false para que el modal '¿Guardar contraseña?' no compita. Google INTEGRADO (§014): éxito → /home con finishAutofillContext(shouldSave:!isGoogleAuth — no guarda credenciales tipeadas nunca enviadas); errores → toast específico (suspendido/conexión/intentos) o genérico Google."
  verify_email:
    route: "/verify-email"
    spec: "Se llega desde login cuando el backend responde 'correo no verificado' (o con email en extra). Scaffold liso + PopScope(canPop:false → _backToLogin): la flecha top-left FIJA (fuera del bloque centrado — antes flotaba dentro de la Column centrada, bug detectado) y el back nativo de Android ambos van a /login porque se llega con go() y no hay stack que pop. Contenido centrado+scroll: ícono de marca icono_verificar_correo.svg (80px, flutter_svg, elemento firma — ExcludeSemantics, el headline ya describe), headline primary + subtítulo con el email destino, casillas OTP (componente verify_email_code_input), CTA 'Verificar' (loading: spinner DENTRO del botón, ver elevated_button_primary; campo y reenviar se bloquean por IgnorePointer en isInProgress), fila '¿No recibiste el código? Reenviar' con cooldown real 60s ('Reenviar en Ns', TextButton deshabilitado — el disabled visible del cooldown sí pinta: es su estado semántico, no un bloqueo de loading). Feedback por AppToast: error genérico 'Ingresa el código de 6 dígitos' (cubre vacío/parcial), 'Código reenviado', 'Verificación simulada'. resend() limpia código+error (el código viejo queda invalidado) y el TextField oculto se resincroniza por listener. INTEGRADO (§006): submit contra /auth/verify-email (éxito → sesión persistida → /home; código errado → casillas rojas + toast) y reenvío contra /auth/resend-verification."
  register:
    route: "/register"
    spec: "Wizard de 3 pasos (§008 + §009 — aprobado por el usuario: el formulario único de 8 inputs era denso). Header compacto SIN imagotipo (decisión del usuario): flecha top-left + register_stepper fijo + headline primary por paso ('Cuéntanos quién eres' / 'Tu correo y tu contraseña' / 'Todo listo, {firstName}') + subtítulo. Paso 1 'Datos': 4 campos LatAm (primer nombre*, segundo nombre, primer apellido*, segundo apellido) + teléfono opcional; sanitización compartida — solo letras latinas con tilde/ñ/ü + espacio + apóstrofe (' y ’), SIN guion (decisión del usuario), filtro al teclear + validación. Teléfono: solo dígitos máx 10, celular colombiano ^3\\d{9}$ (decisión: solo celular, solo dígitos). Paso 2 'Cuenta': email + contraseña (hint interior 'Ej: HotDog2024' — misma clave del login — + helper 'Mínimo 8 caracteres' bajo el campo) + confirmar (hint 'Repite tu contraseña') con ojos de visibilidad independientes. Paso 3 'Revisión': tarjeta Nombre compuesto/Correo/Teléfono o 'Sin teléfono' — la contraseña nunca se muestra. Navegación (modelo del usuario): flecha top-left SIEMPRE sale a /login (abandonar, no retrocede pasos); TextButton 'Atrás' a la izquierda del primario (solo pasos 2-3) retrocede un paso conservando lo tipeado; back nativo Android retrocede paso (paso 1 sale). Transición AnimatedSwitcher ~250ms + AnimatedSize; scroll reset por paso; contenido top-aligned. Teclado NUNCA abre solo al cambiar de paso (decisión del usuario tras probarlo) — solo al tocar campo o cuando 'Continuar' falla (foco al primer inválido del paso, no navega a otro paso). Validación por paso; submit revalida todo. Errores de campo GENÉRICOS (decisión del usuario): 'Teléfono/Correo/Nombre/Apellido incorrecto' — no revelan la regla. EXCEPCIÓN contraseña corta: el error ES la regla 'Mínimo 8 caracteres' — el helperText se reemplaza por errorText al fallar y 'Contraseña incorrecta' no le decía al usuario qué corregir (decisión del usuario tras verla en pantalla); la misma clave sirve de helper y error. Footer persistente '¿Ya tienes cuenta? Inicia sesión' (hit area ≥44dp + Semantics button). Durante submit: IgnorePointer en todo lo interactivo + guard isInProgress en el cubit. INTEGRADO §010: POST /auth/register real — éxito → /verify-email con email en extra y shouldSave:false; 409 correo-duplicado devuelve al paso 2 con 'Este correo ya tiene cuenta' (emailTaken prima sobre formato). Paso 1 lleva además bloque social Google (§013): tras el primario — divider 'o continúa con' + GoogleSignInButton dentro de AnimatedSize 250ms easeOut topCenter (sin él el footer saltaba ~116px en seco al cambiar de paso) + IgnorePointer(isInProgress); 32px de botón a footer (paridad login, no 24); en pasos 2-3 no existe (SizedBox.shrink — Google reemplaza el registro entero, no lo complementa). La G oficial es el ÚNICO Image de los pasos — la aserción 'sin imagotipo' de los tests apunta específicamente a ella."
  forgot_password:
    route: "/forgot-password"
    spec: "Wizard de 3 pasos (§011 — mismo shell que /register): flecha top-left + WizardStepper fijo con labels 'Correo'/'Código'/'Clave' + headline primary por paso + subtítulo. Paso 1 '¿Olvidaste tu contraseña?': solo correo (primario 'Enviar código'). Paso 2 'Revisa tu correo': subtítulo con el email tipeado (misma frase de verify) + SixDigitCodeField SIN autofocus (el wizard nunca abre teclado al cambiar de paso) + fila '¿No recibiste el código? Reenviar' con cooldown 60s ('Reenviar en Ns', TextButton disabled = estado semántico) — primario 'Verificar'. Paso 3 'Crea tu nueva contraseña': 'Nueva contraseña *' con ojo + hint interior 'Ej: HotDog2024' (clave compartida del login — sin él el campo se veía como caja muerta junto al confirm, detectado por el usuario) + helper 'Mínimo 8 caracteres' + 'Confirmar contraseña *' con hint 'Repite tu contraseña' + ojo independiente — primario 'Cambiar contraseña'. Navegación idéntica a register: flecha SIEMPRE abandona a /login (cualquier paso, pop si quedó apilada); 'Atrás' (pasos 2-3) retrocede paso conservando lo tipeado; back nativo retrocede paso (paso 1 sale). Transición AnimatedSwitcher ~250ms + AnimatedSize; scroll reset; foco al primer inválido del paso al fallar. Errores genéricos reutilizando claves: 'Correo incorrecto' / 'Las contraseñas no coinciden' / toast de código 'Ingresa el código de 6 dígitos' (verifyEmailFormInvalid compartida) — EXCEPCIÓN contraseña corta: el error es la regla misma 'Mínimo 8 caracteres' (el helper se reemplaza por errorText y 'Contraseña incorrecta' no decía qué estaba mal — decisión del usuario). Footer compartido '¿Ya tienes cuenta? Inicia sesión' (RegisterLoginFooter con isInProgress||isResending por parámetro). Loading: spinner DENTRO del primario + IgnorePointer/inerter — cubre también isResending ('Verificar', flecha, footer y codeChanged esperan al reenvío, misma carrera que verify; el listener de resync también escucha isResending para barrer dígitos fantasma del IME). PROVISIONAL: envío de código, check OTP y reset simulados (nextStep valida y avanza; submit delay 800ms → AuthSession.markAuthenticated con User stub 'forgot-preview' → success → /home con shouldSave:true — espejo del auto-login real: sin la sesión stub el guard rebota /home→/login en silencio; la stub solo vive en RAM, muere al reiniciar la app. La integración llega con forgot-password/check-reset-code/reset-password). Auto-avanza al 6to dígito igual que verify; resend() limpia código+error y resincroniza el TextField oculto."
  welcome:
    status: "ELIMINADA (decisión del usuario) — splash va directo a /login para no autenticados"
  shell:
    routes: "/home (Inicio), /orders (Pedidos), /profile (Perfil) — branches de un StatefulShellRoute.indexedStack"
    spec: "Marco autenticado §016 — ver componente app_shell (header 64dp con imagotipo horizontal + campana provisional + carrito real §020 + hairline, NavigationBar de 3 secciones, back→Inicio). Cada branch renderiza module_placeholder hasta que su módulo real aterrice como HIJO de su branch (nunca ruta raíz — eso la sacaría del shell). Guard: las 3 rutas exigen sesión; sin sesión → /login."
  home:
    route: "/home"
    spec: "Selector de categorías (§017 + integración §019): Stack[SignatureStrip + ListView]. Contenido: SizedBox 36dp de aire bajo el header → promo_banner carrusel → CategoryCards DINÁMICAS del backend (GET /catalog — una nueva aparece sola sin release; nombre = dato del backend, cover local por slug vía CatalogAssets). Cada card = straddle_card con imagen flotante de categoría + nombre titleSmall Anton + subtítulo ('N productos' / 'Disponible próximamente' en vacías) + chevron 18dp. Tap → push /home/category/:slug. Datos: CatalogCubit lazySingleton compartido en el shell — refresh() silencioso al entrar (sin flicker; si falla conserva caché), primera carga con loading/error + retry (catalog_states)."
  category_products:
    route: "/home/category/:id (hija de la branch /home — conserva shell + nav)"
    spec: "Lista de productos de una categoría (§017 + integración §019): Stack[SignatureStrip + ListView + flecha fija]. Encabezado = patrón scrolling_title con el nombre REAL del backend (resuelto por :categorySlug del CatalogCubit). Lista: hero_product_card del producto isFeatured && isAvailable ('EL DE LA CASA' tag + nombre + tagline + precio + FilledButton '+ Agregar') + product_card por ítem restante (imagen flotante + nombre + tagline 2 líneas max + precio primary + botón '+' circular). Producto agotado → sold_out_tag en el slot del '+' y sin tap — SIN atenuación (§019, decisión del usuario). Tap en card o '+' → push /home/category/:categorySlug/product/:productSlug (detalle). Categorías vacías → card fantasma a caballo centrada en viewport + 'Disponible próximamente' (cover por slug). Datos reales del CatalogCubit compartido + refresh silencioso al entrar; loading/error con retry solo sin caché."
  product_detail:
    route: "/home/category/:categoryId/product/:productId (nieta de /home — conserva shell + nav)"
    spec: "Detalle + personalización del producto (§018 + integración §019): Stack[SignatureStrip + Column[ListView + footer fijo] + flecha fija]. Título del producto = patrón scrolling_title. El producto se resuelve del CatalogCubit por :productSlug (busca en TODAS las categorías). Contenido: _ProductHeaderCard (straddle_card 150dp surfaceContainerHigh, imagen flotante con imageUrl→fallback por slug + ingredientsSummary 'A, B y C.' de los defaults del grupo ingredients + basePrice primary) → customization_section por grupo real del backend: '¿Se le quita algo?' (RemovableRow = opciones del grupo ingredients con includedByDefault && isRemovable — pan/salchicha fijos no aparecen), '¿Le agregamos algo más?' (OptionRow = !includedByDefault O (fijos con extraPrice>0 — doble salchicha cobrada; pan queda fuera por precio 0) con '+$X.XXX' o tag 'Agotado'), 'Toppings' y 'Salsas' (SelectChips por slug de grupo; sección solo si hay opciones). Opción agotada → enabled:false (Opacity 0.45 + ícono cancel_rounded error, tap inerte — atenuación de opciones aprobada, la de cards descartada). Ingrediente incluido agotado → icono swap_horiz SOLO si isReplaceable (agotado no reemplazable = solo X) que despliega picker de adicionales isAvailable && isReplacementEligible sin etiqueta trailing (reemplazo 1:1 sin costo — regla del usuario; la palabra 'Gratis' se eliminó de toda la UI por decisión del usuario). Footer fijo opaco: 'Total' + total dinámico (basePrice + Σ extraPrice de adicionales) + FilledButton 'Agregar al carrito' REAL (§020: arma el CartItem con filas CartModifier added/removed — quitados, reemplazo gratis como removed+added a 0, adicionales con precio real, toppings/salsas a 0 — lo envía al CartCubit, AppToast.success 'Agregado al carrito' y context.pop() a la carta) — producto agotado → FilledButton disabled 'Agotado'. Slug desconocido tras refresh → vista inline 'Este producto ya no está en la carta' + 'Volver al menú'. Refresh silencioso al entrar. MODO EDICIÓN (§021 + correcciones revisor-ui): la misma pantalla monta en /home/cart/edit (hija de cart, slideUp — extra=CartItem, redirect a cartRoute si el extra no lo es) con param editingItem — los 5 sets de selección (hoy agrupados en DetailSelections _sel) se precargan una vez mid-build vía DetailSelections.fromCartItem (removed→removed; added con replacesOptionId→replacements[agotado]; added sin marca→extras/toppings/sauces según el grupo del producto; opción caída de la carta se descarta; el id reemplazado NO entra a _removed — igual que en el modo agregar vive solo en _replacements: tenerlo en ambos emitía la fila removed DUPLICADA al guardar, bug crítico) y _buildModifiers además filtra los removed ya cubiertos por replacements (barrera). Cue de orientación: el título naciente pasa a 'Editando · {name}' (detailEditingTitle — era idéntica a la de agregar salvo el CTA), el CTA dice 'Guardar cambios' (cartEditSaveCta) y con qty>1 el label del footer pasa a 'Total por unidad' (detailTotalPerUnitLabel — el total es por unidad y el sheet pregunta a cuántos). El CTA queda HABILITADO aunque el producto esté agotado — el ítem ya vive en el carrito y la revalidación real es del backend al crear la orden. Guardar: si la config no cambió (misma clave sameConfiguration) sale en seco SIN sheet ni toast (antes preguntaba el alcance y mentía 'Cambios guardados'); si cambió, con qty>1 pregunta el alcance con cart_edit_scope_sheet — 'Solo 1' separa una unidad ADYACENTE a su origen / 'Las N' aplica a toda la fila — CartCubit.editItem devuelve CartEditOutcome y el toast lo cuenta: 'Cambios guardados' o 'Se combinó con la fila igual' (merge silencioso revisor-ui). Descarte con cambios sin guardar: PopScope cubre el back DEL SISTEMA (maybePop sí honra popDisposition) y la flecha usa _requestLeave manual (context.pop() de go_router bypasea PopScope — pop declarativo de página vía onPopPage→didPop): diálogo '¿Descartar los cambios?' con 'Seguir editando'/'Descartar'. Slug desconocido en edición → la vista dice 'Volver al carrito' (el pop cae al carrito). Modelo: CartItem gana snapshot includedNames ('Lleva:' del desplegable) y las filas added del reemplazo gratis llevan replacesOptionId→id del agotado (no entra a sameConfiguration: topping gratis y reemplazo gratis fusionan igual)."
  cart:
    route: "/home/cart (hija de la branch /home — conserva shell + nav, transición slideUp)"
    spec: "Carrito del pedido en construcción (§020, presentación — estado 100% local en CartCubit lazySingleton sobre el shell, sin persistencia MVP; pulido revisor-estetico + revisor-ui aplicado). Familia del detalle: Stack[SignatureStrip + Column[contenido + footer fijo] + flecha back fija onPrimary a 12/4]. Título 'Tu carrito' = patrón scrolling_title (widthFactor 0.602 naciendo del mostaza, dentro del scroll cuando hay ítems; la vista vacía lo fija en Column). Filas: un Dismissible endToStart por ítem (fondo = delete_outline error a la derecha) envolviendo cart_item_tile — straddle_card surfaceContainerLow radius 14 con ProductImage 80px FLOTANTE a caballo del borde izquierdo (Positioned left=cardLeft−kFrameOverhang, centrado vertical; mitad mostaza mitad card — mismo gesto que product_card, pulido estético). Contenido anclado al marco (padding-left = imageSize−overhang+kFrameTextGap=50): nombre titleSmall w700 (Anton — voz de producto) + unitPrice bodySmall α0.65 SOLO cuando quantity>1 (con 1 duplicaba el lineTotal) a la derecha; SIN resumen bajo el título (§021b, decisión del usuario — la línea 'sin X · +Y' se retiró y con ella cart_item_summary.dart): el nombre comparte fila con el chip 'Detalle' — píldora outlined compacta (borde outlineVariant radius 10, label labelSmall w600 α0.75 + chevron expand_more/less 14px primary DENTRO — el visual es pequeño pero el hit area conserva 40dp vía ConstrainedBox+Center) — es el único control del desplegable: Semantics container/button/expanded + label cartItemDetailToggle, hit area ConstrainedBox minHeight 40. unitPrice bodySmall α0.65 bajo el nombre solo cuando quantity>1. El panel entra/sale con AnimatedSize 180ms easeOutCubic top-anchored. Al abrir deja ver cart_item_detail_panel (§021b): secciones de la pantalla de personalización con título titleSmall Anton primary w800 (la firma de las secciones del detalle un paso más pequeña — decisión del usuario) e ítems en bullet — punto 6px primary alineado a la primera línea + texto bodySmall α0.8 con sangría francesa: 'Ingredientes' (snapshot includedNames), 'Se le quitó' (removeds, CON VÍNCULO del reemplazo 'agotado → reemplazo' vía replacesOptionId — esas filas added NO se repiten en Adicionales), 'Adicionales' (added group extra — o sin etiquetar, fallback de filas viejas — con ' +$X.XXX' primary cuando cobran), 'Toppings' (group topping), 'Salsas' (group sauce) — solo se pintan las que aplican; la sección viene de CartModifier.group (snapshot del set de origen, §021b — el panel no resuelve el producto en la carta); ítem vacío sin snapshot ni modifiers → línea 'Tal cual de la carta' para no quedar desnudo) + TextButton.icon 'Editar' primary 16px a la derecha → push /home/cart/edit con extra=CartItem (redirect a cartRoute si el extra no es CartItem — deep link/estado restaurado, revisor-ui); debajo Row[QuantityStepper (botones 44×44 icon 20 primary + tooltips l10n 'Quitar uno'/'Agregar uno' + Semantics 'Cantidad: N' con excludeSemantics en el número — targets reales, no shrinkWrap de 28px) + IconButton delete_outline 44px onSurface α0.55 tooltip 'Quitar del carrito' (affordance del swipe y vía sin gesto) + Spacer + lineTotal titleSmall primary w800]. Tres vías de eliminar (swipe, stepper − en 1, ícono) → todas pasan por removeItem + AppToast.info '{name} eliminado del carrito' (feedback mínimo ante destrucción sin deshacer — undo/banner queda pendiente UX). Cierre de lista: cart_browse_more_card — ghost card punteada (CustomPaint dash 6/gap 4, borde outlineVariant radius 14, SIN fill) en posición straddle con '+' primary α0.7 + '¿Se te antoja algo más?' bodyMedium w600 α0.7 centrados, tap → go(homeRoute); solo existe en lista no-vacía (decisión del usuario — DIRECCION revisor-estetico §020). Footer fijo opaco surface + borde superior outlineVariant (idéntico al detalle): 'Subtotal' bodySmall α0.7 + formatCop titleMedium primary w800 a la izquierda y FilledButton 'Ir a pagar' expandido PROVISIONAL → AppToast.info comingSoon hasta §021 checkout. Vacío: Column fija (no ListView — el Center en scroll no centra) con el view centrado dentro de la zona NEGRA (padding-left = strip; sin él se derramaba sobre mostaza): shopping_cart_outlined 44px primary α0.85 + 'Nada por acá todavía' (no repite el título) + 'Suma algo rico del menú' + FilledButton.tonalIcon 'Ver el menú' → go(homeRoute). Merge al re-agregar: mismo producto + MISMO conjunto de modificadores (clave optionId:action:priceDelta, orden irrelevante) suma cantidad en la misma fila — configuración distinta = fila aparte con id 'cart-<n>' determinista."
  checkout:
    route: "/home/cart/checkout (hija de cart — conserva shell + nav, slideUp; carrito vacío → redirect /home/cart)"
    spec: "Confirmación del pedido (§022 + revisión del usuario §022a, solo presentación — PROVISIONAL: datos mock, confirmación simulada; la integración llega por endpoint: /store/config, /addresses, POST /orders). Familia del carrito/detalle: Stack[SignatureStrip + IgnorePointer(todo, confirmInProgress) → Stack[Column[ListView + footer fijo] + flecha back fija onPrimary 12/4]]. Título 'Confirmar pedido' = patrón scrolling_title (widthFactor 0.602). Cuatro CustomizationSections en el orden del usuario: 1) 'Tipo de pedido' — segmented_toggle Local/Domicilio (§022b — 'Recoger en el local' → 'Local', decisión del usuario); pickup muestra ícono storefront + 'Lo recoges en' + store mock referencia (Depredadog — Costado norte del parque principal) + 'Te avisamos cuando esté listo'; domicilio lista CheckoutOptionRows (ícono por tipo + label + detalle + círculo check/radio) de ubicaciones guardadas mock como PUNTOS DE REFERENCIA (Casa 'Casa blanca frente a la cancha · Vereda El Carmen', Trabajo 'Segundo local del puente hacia arriba · Centro' — la zona no tiene nomenclatura de calles) + 'Nueva ubicación' como toggle de SOLO expandir/colapsar (§022d — el segundo tap ya NO desmarca ni restaura guardada: solo colapsa conservando la selección, vía CheckoutState.newAddressExpanded; desmarcar es tocar otra fila; los campos sobreviven y un confirm fallido reabre el form colapsado para mostrar el error) (AnimatedSize 180ms easeOutCubic): 'Punto de referencia *' ÚNICO REQUERIDO + 'Barrio o sector (opcional)' + checkbox 'Guardar esta ubicación' (mock) que al marcarse revela _AddressTypePicker con la física de la familia (§022b — el nombre solo sirve al guardar): label '¿Qué lugar es?' w600 + SelectChips Casa/Trabajo/Otro reutilizados de customization_section; 'Otro' revela CustomTextField 'Nombre del lugar' (hint 'Ej: casa de mi mamá') — estado newAddressType/newAddressLabel del cubit. CIERRE del bloque domicilio: hairline outlineVariant indent 14 + fila del PIN DE GOOGLE DEL PEDIDO (§022d — fuera del form: el punto exacto sirve para dirección nueva O guardada; botón outlined 'Adjuntar ubicación de Google' pin_drop 18px → estado adjunto: check primary + 'Ubicación adjunta' + link mock maps.app.goo.gl + close 'Quitar ubicación', Semantics label; cubit attachDeliveryLocation/removeDeliveryLocation → deliveryLocationLink order-level). El aviso 'Domicilio gratis' se RETIRÓ de arriba de las direcciones (§022d — sobraba; el 'Gratis' del resumen lo dice donde importa) y checkoutDeliveryFreeNotice quedó muerta. 2) 'Observación' (§022a — renombrada y REUBICADA justo bajo Tipo de pedido) — TextField multilínea 2-4 líneas opcional, hint con ejemplo acorde a la zona ('p. ej. pago con billete de 50, traer cambio'). 3) 'Pago' — CheckoutOptionRow Nequi con el ÍCONO oficial (isotipo cuadro+#DA0081 + N #200020 — recorte del wordmark, §022b) sobre tile blanco 30×30 radius 7 (§022a: el wordmark #200020 se pierde en el tema oscuro — tile blanco, idioma de logos de pago; assets/images/nequi_logo.svg CC BY-SA 4.0, atribución en assets/ATTRIBUTION.md; SIN subtítulo — 'Te llega la notificación push' retirado por el usuario) que despliega el campo Celular Nequi PRELLENADO con el phone de la cuenta y editable (solo dígitos máx 10, regex ^3\d{9}$; vacío→arranca vacío) + fila 'Pagar al recibir tu pedido' SOLO en domicilio (§022c, decisión del usuario — un pedido para el local que nadie recoge ya quedó hecho y nunca se cobró: pickup es PREPAGO; setOrderType a Local fuerza paymentMethod=nequi y setPaymentMethod rechaza onDelivery en pickup por defensa; en su lugar se muestra la nota 'En el local el pago es solo por transferencia' — NOTA informativa atenuada (info_outline_rounded 15px + bodySmall onSurface 0.6): explica la restricción sin competir con el highlight mostaza de 'Domicilio gratis'). 4) 'Tu pedido' — línea 'N× Nombre' … lineTotal por ítem (sin modificadores; nombre en titleSmall w700 — Anton), hairline, Subtotal, fila 'Domicilio' solo en delivery con valor 'Gratis' EN PRIMARY cuando fee=0 (§022a — dice gratis en vez de $0) o formatCop si cobra, TOTAL Anton primary w800. Footer fijo idéntico al carrito: 'Total' + valor + FilledButton 'Confirmar pedido' (spinner 22px onPrimary dentro durante el delay). Validación SOLO al confirmar e INLINE: domicilio exige ubicación elegida o punto de referencia (error por campo + sección), Nequi exige celular válido — nada de toast; al fallar, foco/scroll al primer inválido (landmark→celular — patrón login/register). CheckoutOptionRow gana param leading (Widget) — logos de marca conservan sus colores, icon queda para Material teñido. Controllers del form siembran desde el cubit (sobreviven al toggle) y el checkbox recibe ensureVisible al expandir. El cuerpo pickup/domicilio transiciona con AnimatedSwitcher fade + AnimatedSize 180ms easeOutCubic; filas y píldoras exponen Semantics(selected, inMutuallyExclusiveGroup). Confirmación PROVISIONAL: delay mock 800ms (IgnorePointer total + spinner) → AlertDialog barrierDismissible:false con imagotipo_depredadog 72px (ExcludeSemantics), '¡Pedido confirmado!', 'Te avisamos cuando esté listo' (SIN número de orden — §022b: el consecutivo delata el volumen de ventas) + FilledButton ancho completo 'Ver mis pedidos' → pop + CartCubit.clear() + go(/home) compromete la branch y go(/orders) UN FRAME DESPUÉS. Dominio §022a: SavedAddress.street→landmark (punto de referencia), neighborhood opcional (detail sin separador colgante), CheckoutState.newLandmark/newNeighborhood/newLocationLink (pin adjunto mock, nullable con copyWith funcional), deliveryFee 0 en el mock store."
  orders:
    status: "PLACEHOLDER (§016) — module_placeholder 'Pedidos' con icono receipt_long_rounded"
  profile:
    status: "PLACEHOLDER (§016) — module_placeholder 'Perfil' con icono person_rounded"

changelog:
