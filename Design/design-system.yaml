      - "category_products (§017): flecha back negra Positioned SOBRE la franja + título Anton mostaza naciendo del mostaza (widthFactor 0.602 — el usuario calibró el punto exacto a mano: el filo de la 1ª letra se funde sin perderse; iterado 0.60/0.615/0.62/0.63/0.6175 antes del punto manual). Hero 'EL DE LA CASA' + productos con tagline ahora a 2 líneas (feedback: los '...' cortaban eslóganes reales). Vacías → card fantasma a caballo centrada."
