# Design System — PCalientes
# Convención: ver .devin/skills/design-system-docs
# Cada cambio visual → bump de version + spec actualizado + entrada en changelog.

meta:
  product: PCalientes
  version: 1.0.1
  updated: 2026-10-23

palette:
  # Seed mínima — redefinir al clonar el template para un producto real.
  primary: "#1565C0"
  on_primary: "#FFFFFF"
  surface: "#FFFFFF"
  on_surface: "#212121"
  error: "#B00020"

typography:
  scale: material3 # display/headline/title/body/label por defecto de M3

spacing:
  unit: 4
  tokens: {xs: 4, sm: 8, md: 16, lg: 24, xl: 32}

components: {}   # specs por widget se agregan aquí con cada feature visual

screens: {}      # specs por pantalla

changelog:
  - version: 1.0.0
    date: 2026-10-16
    notes: Seed inicial del template — paleta y tokens genéricos, sin specs de producto.
  - version: 1.0.1
    date: 2026-10-23
    notes: Rebranding del seed al producto PCalientes — sin cambios visuales; paleta/tokens genéricos pendientes de definir con la primera pantalla real.
