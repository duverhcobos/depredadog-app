      - "Modelo de navegación decidido por el usuario: flecha top = abandonar a /login en cualquier paso; 'Atrás' secundario (pasos 2-3) = retroceder paso; back nativo Android = retroceder paso. Teclado nunca abre al cambiar de paso ('no me gusta que el teclado se me active automaticamente') — solo al tocar campo o al fallar Continuar (foco al primer inválido)."
